<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="西科乌托邦" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>西科乌托邦 · 校园社区</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("campus-community-theme") === "dark" ? "dark" : "light";
    } catch {}
  </script>
  <style>
:root {
  --ink: #202124;
  --muted: #8b9098;
  --line: #eceef1;
  --soft: #f5f6f8;
  --red: #ff2442;
  --blue: #3390ec;
  --blue-dark: #2680d8;
  --outgoing: #e4f2ff;
  --danger: #f04452;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 0 0, rgba(51, 144, 236, .12), transparent 25%),
    radial-gradient(circle at 100% 100%, rgba(255, 78, 103, .08), transparent 28%),
    #e9edf2;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell {
  position: relative;
  width: min(760px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  background: #f8f8f8;
  box-shadow: 0 0 45px rgba(23, 25, 28, .09);
}

.appbar {
  position: sticky;
  z-index: 15;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 66px;
  padding: 9px 18px;
  border-bottom: 1px solid rgba(236, 238, 241, .9);
  background: rgba(255, 255, 255, .95);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff4562, #ff7d67);
  color: #fff; font-size: 18px; font-weight: 800;
  box-shadow: 0 7px 18px rgba(255, 54, 83, .2);
}
.brand-copy { display: flex; flex-direction: column; gap: 2px; }
.brand-copy strong { font-size: 18px; }
.brand-copy small { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.brand-copy i, .online-pill i { width: 7px; height: 7px; border-radius: 50%; background: #2db67b; box-shadow: 0 0 0 3px rgba(45, 182, 123, .12); }
.appbar-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  position: relative;
  width: 39px; height: 39px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink); font-size: 19px;
}
.icon-btn:hover { background: #f3f4f6; }
.publish-btn { background: #f4f5f7; color: var(--ink); font-size: 24px; }
.badge {
  position: absolute; top: 2px; right: 1px;
  min-width: 17px; height: 17px; padding: 0 4px;
  display: grid; place-items: center;
  border: 2px solid #fff; border-radius: 99px;
  background: var(--danger); color: #fff;
  font-size: 9px; font-weight: 750;
}
.hide { display: none !important; }

.content { padding: 19px 18px 94px; }
.view { display: none; }
.view.active { display: block; }

body[data-view="forum"] .appbar { display: none; }
body[data-view="forum"] .app-shell { background: #fff; }
body[data-view="forum"] .content { padding: 0 0 102px; }
body[data-view="forum"] .home-note { display: none; }

.telegram-header {
  position: sticky;
  z-index: 12;
  top: 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 76px;
  padding: 18px 16px 10px;
  background: rgba(255, 255, 255, .95);
  backdrop-filter: blur(15px);
}
.edit-pill {
  justify-self: start;
  min-width: 70px;
  height: 42px;
  padding: 0 16px;
  border: 1px solid #e1e4e8;
  border-radius: 99px;
  background: #fff;
  color: var(--ink);
  font-size: 16px;
  box-shadow: 0 2px 7px rgba(25, 30, 36, .04);
}
.chat-heading { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.chat-heading strong { font-size: 20px; letter-spacing: -.3px; }
.telegram-search {
  position: relative;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 16px 12px;
  overflow: hidden;
  border-radius: 99px;
  background: #f1f2f4;
}
.telegram-search span {
  position: absolute;
  left: calc(50% - 49px);
  color: #92979e;
  font-size: 27px;
  line-height: 1;
  pointer-events: none;
}
.telegram-search input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  text-align: center;
  font-size: 18px;
}
.telegram-search input::placeholder { color: #92979e; opacity: 1; }
.chat-search-results { display: none; padding: 0 14px; }
.chat-search-results.open { display: block; }
.chat-search-heading {
  display: flex;
  justify-content: space-between;
  padding: 9px 4px 7px;
  color: var(--muted);
  font-size: 11px;
}
.chat-search-result {
  width: 100%;
  display: grid;
  grid-template-columns: 43px minmax(0, 1fr);
  gap: 11px;
  align-items: center;
  padding: 12px 4px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  text-align: left;
}
.chat-search-result:hover { background: #f8fafc; }
.search-result-avatar {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  font-size: 17px;
  font-weight: 750;
}
.search-result-copy { min-width: 0; }
.search-result-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.search-result-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.search-result-top time { color: var(--muted); font-size: 9px; white-space: nowrap; }
.search-result-snippet {
  display: -webkit-box;
  overflow: hidden;
  margin-top: 4px;
  color: #6e747c;
  font-size: 11px;
  line-height: 1.45;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.search-result-snippet mark { padding: 0 2px; border-radius: 3px; background: #fff1b8; color: #202124; }
.search-empty { padding: 42px 12px; color: var(--muted); font-size: 12px; text-align: center; }
.telegram-actions { justify-self: end; display: flex; align-items: center; gap: 12px; }
.circle-action, .compose-action {
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.circle-action {
  position: relative;
  width: 45px;
  height: 45px;
  border: 1px solid #d9dde3;
  background: #fff;
  color: var(--ink);
}
.circle-action::before {
  content: "";
  position: absolute;
  width: 29px;
  height: 29px;
  border: 2px dashed #202327;
  border-radius: 50%;
  transform: rotate(-24deg);
}
.circle-action span { position: relative; z-index: 1; font-size: 27px; font-weight: 300; line-height: 1; }
.compose-action {
  width: 49px;
  height: 49px;
  border: 0;
  background: var(--blue);
  color: #fff;
  box-shadow: 0 6px 15px rgba(51, 144, 236, .2);
}
.compose-action svg {
  width: 27px;
  height: 27px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
body[data-view="forum"] .group-list {
  margin-top: 4px;
  border-radius: 0;
  background: #fff;
}
body[data-view="forum"] .group-row {
  position: relative;
  grid-template-columns: 60px minmax(0, 1fr) auto;
  gap: 12px;
  min-height: 84px;
  padding: 12px 16px;
}
body[data-view="forum"] .group-avatar { width: 60px; height: 60px; font-size: 23px; }
body[data-view="forum"] .group-name { font-size: 15px; }
body[data-view="forum"] .group-preview {
  display: -webkit-box;
  margin-top: 5px;
  overflow: hidden;
  white-space: normal;
  line-height: 1.35;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  font-size: 13px;
}
body[data-view="forum"] .group-time { font-size: 11px; }
body[data-view="forum"] .group-right { padding: 5px 0; }
body[data-view="forum"] .unread-bubble { min-width: 30px; height: 23px; font-size: 11px; }

body.forum-editing .group-row {
  padding-left: 66px;
  cursor: default;
}
body.forum-editing .group-row.selected { background: #f1f7ff; }
.select-circle {
  position: absolute;
  left: 17px;
  top: 50%;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  transform: translateY(-50%);
  border: 2px solid #c7cacf;
  border-radius: 50%;
  background: #fff;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.group-row.selected .select-circle { border-color: var(--blue); background: var(--blue); }
.edit-action-bar {
  position: fixed;
  z-index: 32;
  left: 50%;
  bottom: 15px;
  width: min(calc(760px - 28px), calc(100% - 28px));
  display: none;
  transform: translateX(-50%);
  gap: 10px;
}
body.forum-editing .edit-action-bar { display: flex; }
body.forum-editing .bottom-nav { display: none; }
.edit-action-bar button {
  flex: 1;
  height: 49px;
  border: 1px solid rgba(223, 227, 232, .95);
  border-radius: 99px;
  background: rgba(255, 255, 255, .94);
  color: #25282c;
  font-size: 15px;
  box-shadow: 0 8px 24px rgba(28, 36, 44, .13);
  backdrop-filter: blur(14px);
}
.edit-action-bar button:hover { background: #fff; }
.edit-action-bar button:disabled { color: #b6bac0; cursor: default; }

body[data-view="forum"] .bottom-nav {
  bottom: 12px;
  left: 50%;
  width: min(calc(760px - 24px), calc(100% - 24px));
  padding: 5px 18px;
  border: 1px solid rgba(223, 227, 232, .95);
  border-radius: 34px;
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 9px 26px rgba(28, 36, 44, .15);
}
body[data-view="forum"] .nav-item { gap: 2px; padding: 5px; font-size: 10px; }
body[data-view="forum"] .nav-item.active .nav-icon {
  padding: 7px 15px;
  border-radius: 22px;
  background: #dceeff;
  color: var(--blue);
}
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; margin: 1px 0 17px; }
.page-heading h1 { margin: 0; font-size: 27px; letter-spacing: -.7px; }
.page-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.online-pill {
  display: flex; align-items: center; gap: 7px;
  margin-top: 8px; padding: 6px 10px;
  border-radius: 99px; background: #f1faf6;
  color: #229368; font-size: 10px;
}
.forum-count { margin-top: 8px; color: var(--muted); font-size: 10px; }

.search-box {
  height: 42px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 13px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: #f1f2f4;
}
.search-box:focus-within { border-color: #e7c8ce; background: #fff; box-shadow: 0 0 0 3px rgba(255, 36, 66, .05); }
.search-box span { color: #8e939a; font-size: 19px; }
.search-box input { width: 100%; border: 0; outline: 0; background: transparent; }
.search-box input::placeholder { color: #9ba0a7; }

.topic-scroller {
  display: flex; gap: 8px;
  margin: 12px -18px 20px;
  padding: 0 18px;
  overflow-x: auto;
  scrollbar-width: none;
}
.topic-scroller::-webkit-scrollbar { display: none; }
.topic-chip {
  flex: 0 0 auto;
  border: 0; border-radius: 99px;
  padding: 7px 12px;
  background: #fff; color: #656a71; font-size: 12px;
}
.topic-chip.active { background: #222; color: #fff; font-weight: 600; }
.feed-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.feed-label h2 { margin: 0; font-size: 16px; }
.feed-label span { color: var(--muted); font-size: 10px; }

.post-grid { columns: 2; column-gap: 10px; }
.post-card {
  width: 100%;
  display: inline-block;
  break-inside: avoid;
  margin: 0 0 12px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
}
.post-cover {
  position: relative;
  height: 185px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 14px;
}
.post-cover.tall { height: 235px; }
.post-cover::before, .post-cover::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, .18);
}
.post-cover::before { width: 130px; height: 130px; left: -38px; top: -34px; }
.post-cover::after { width: 90px; height: 90px; right: -24px; bottom: -22px; }
.cover-emoji { position: relative; z-index: 1; font-size: 54px; filter: drop-shadow(0 9px 15px rgba(0, 0, 0, .12)); }
.cover-caption {
  position: absolute; z-index: 2; left: 11px; bottom: 10px;
  padding: 4px 8px; border-radius: 7px;
  background: rgba(255, 255, 255, .83); color: #5b5e63;
  font-size: 9px; backdrop-filter: blur(5px);
}
.post-title {
  display: -webkit-box;
  overflow: hidden;
  margin: 8px 2px 6px;
  font-size: 13px; line-height: 1.45;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.post-meta { display: flex; align-items: center; justify-content: space-between; gap: 5px; padding: 0 2px; }
.post-user { display: flex; align-items: center; gap: 5px; min-width: 0; color: #72777e; font-size: 10px; }
.mini-avatar {
  flex: 0 0 20px; width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 50%; background: #dfe3e8;
  color: #646a72; font-size: 8px; font-weight: 700;
}
.post-likes { color: #7c8188; font-size: 10px; white-space: nowrap; }
.empty-state { padding: 55px 12px; color: var(--muted); text-align: center; line-height: 1.7; }

.list-label { display: flex; align-items: center; justify-content: space-between; margin: 23px 3px 8px; color: var(--muted); font-size: 11px; }
.list-label button { border: 0; background: transparent; color: var(--blue); font-size: 11px; }
.group-list { display: flex; flex-direction: column; background: #fff; border-radius: 15px; overflow: hidden; }
.group-list[hidden] { display: none; }
.group-row {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) auto;
  align-items: center; gap: 11px;
  width: 100%; padding: 12px;
  border: 0; border-bottom: 1px solid var(--line);
  background: #fff; color: var(--ink); text-align: left;
}
.group-row:last-child { border-bottom: 0; }
.group-row:hover { background: #fafbfc; }
.group-avatar {
  position: relative; width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 50%; color: #fff; font-size: 21px; font-weight: 750;
}
.group-avatar::after {
  display: none;
}
.group-content { min-width: 0; }
.group-name-line { display: flex; align-items: center; gap: 6px; }
.group-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
.pin-mini { color: #aeb2b8; font-size: 10px; }
.group-preview { margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
.group-right { align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; min-width: 32px; padding: 4px 0; }
.group-time { color: #9ca1a8; font-size: 9px; white-space: nowrap; }
.unread-bubble { min-width: 21px; height: 21px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px; background: var(--blue); color: #fff; font-size: 9px; font-weight: 700; }
.unread-bubble.quiet { background: #eceef1; color: #8f949b; }
.home-note { display: flex; gap: 9px; margin-top: 15px; padding: 12px; border-radius: 12px; background: #f2f4f7; color: #70767e; font-size: 10px; line-height: 1.55; }
.home-note span { color: var(--red); }
.home-note p { margin: 0; }

.profile-hero {
  padding: 27px 16px 20px;
  border-radius: 18px;
  color: #fff;
  text-align: center;
  background: linear-gradient(140deg, #ff536d, #ff7b63 60%, #ffb15e);
}
.profile-avatar { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 12px; border: 3px solid rgba(255,255,255,.75); border-radius: 50%; background: rgba(255,255,255,.22); font-size: 25px; font-weight: 750; }
.profile-hero h1 { margin: 0 0 5px; font-size: 22px; }
.profile-hero > p { margin: 0; opacity: .85; font-size: 11px; }
.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
.profile-stats button { display: flex; flex-direction: column; gap: 2px; border: 0; background: transparent; color: #fff; }
.profile-stats strong { font-size: 17px; }
.profile-stats span { opacity: .8; font-size: 9px; }
.my-shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.my-shortcuts button { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 15px 6px; border: 0; border-radius: 14px; background: #fff; color: var(--ink); }
.my-shortcuts button > span { font-size: 19px; color: var(--red); }
.my-shortcuts strong { font-size: 11px; }
.my-shortcuts small { color: var(--muted); font-size: 9px; }
.menu-card { padding: 0 14px; border-radius: 14px; background: #fff; }
.menu-card button { width: 100%; display: flex; justify-content: space-between; padding: 16px 1px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
.menu-card button:last-child { border-bottom: 0; }
.menu-card span { color: var(--muted); font-size: 11px; }
.prototype-note { padding: 0 5px; color: var(--muted); font-size: 10px; line-height: 1.6; }

.bottom-nav {
  position: fixed; z-index: 16; left: 50%; bottom: 0;
  width: min(760px, 100%); transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 8px 26px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(18px);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; border: 0; background: transparent; color: #999ea5; font-size: 9px; }
.nav-item.active { color: var(--ink); font-weight: 650; }
.nav-icon { font-size: 18px; line-height: 1; }

.chat-page, .post-detail {
  position: fixed; z-index: 30; inset: 0;
  display: none; flex-direction: column;
  width: min(760px, 100%); margin: 0 auto;
  background: #eef2f5;
}
.chat-page.open, .post-detail.open { display: flex; }
.chat-header, .detail-header {
  z-index: 2; display: flex; align-items: center; gap: 7px;
  min-height: 62px; padding: 8px 11px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
}
.back-btn { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); font-size: 30px; line-height: 1; }
.chat-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 0; border: 0; background: transparent; text-align: left; color: var(--ink); }
.chat-avatar { flex: 0 0 38px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 16px; font-weight: 750; }
.chat-title-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chat-title-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chat-title-copy small { color: var(--muted); font-size: 9px; }
.header-icon { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); font-size: 18px; }
.header-icon:hover { background: #f2f4f7; }
.pinned-bar { display: flex; align-items: center; gap: 8px; min-height: 35px; padding: 7px 14px; border-bottom: 1px solid #dde3e9; background: rgba(255,255,255,.9); }
.pinned-bar span { color: var(--blue); }
.pinned-bar p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #667080; font-size: 10px; }
.chat-wallpaper {
  flex: 1; overflow-y: auto;
  touch-action: pan-y;
  background-color: #eaf0f5;
  background-image:
    radial-gradient(circle at 20px 20px, rgba(86,129,162,.065) 1.5px, transparent 1.5px),
    radial-gradient(circle at 60px 60px, rgba(86,129,162,.05) 1px, transparent 1px);
  background-size: 80px 80px;
}
.message-list { display: flex; flex-direction: column; gap: 8px; padding: 14px 12px 20px; }
.date-pill, .system-message { align-self: center; margin: 3px auto; padding: 4px 9px; border-radius: 99px; background: rgba(91,108,123,.12); color: #637180; font-size: 9px; }
.system-message { background: rgba(255,255,255,.72); }

.drawer {

.profile-rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }

/* Liquid Glass theme */
:root {
  --glass-stroke: rgba(255, 255, 255, .72);
  --glass-stroke-soft: rgba(255, 255, 255, .42);
  --glass-shadow: 0 18px 48px rgba(43, 63, 92, .14);
  --glass-inset: inset 0 1px 0 rgba(255, 255, 255, .92), inset 0 -1px 0 rgba(255, 255, 255, .24);
  --pointer-x: 50vw;
  --pointer-y: 20vh;
}

html { background: #dceaf7; }

body {
  overflow-x: hidden;
  background:
    radial-gradient(circle at 9% 6%, rgba(150, 207, 255, .85), transparent 31%),
    radial-gradient(circle at 91% 17%, rgba(255, 190, 217, .72), transparent 30%),
    radial-gradient(circle at 17% 90%, rgba(180, 245, 221, .8), transparent 33%),
    radial-gradient(circle at 86% 82%, rgba(255, 219, 167, .62), transparent 30%),
    linear-gradient(145deg, #eef5fb 0%, #e8f1f8 44%, #f6eff4 100%);
}

.liquid-background {
  position: fixed;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.liquid-filter-defs {
  position: fixed;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}
.liquid-background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(330px circle at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, .28), transparent 72%);
  transition: background .2s ease;
}
.liquid-orb {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(8px);
  opacity: .72;
  mix-blend-mode: screen;
  animation: liquid-drift 16s ease-in-out infinite alternate;
}
.orb-one { width: 42vw; height: 42vw; max-width: 520px; max-height: 520px; left: -9%; top: -11%; background: radial-gradient(circle at 35% 30%, #a9d9ff, #7f9fed 60%, transparent 72%); }
.orb-two { width: 35vw; height: 35vw; max-width: 460px; max-height: 460px; right: -8%; top: 7%; background: radial-gradient(circle at 45% 35%, #ffd2e5, #c7a3ff 62%, transparent 75%); animation-delay: -5s; }
.orb-three { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; left: 4%; bottom: -17%; background: radial-gradient(circle at 45% 38%, #c5ffe9, #8de0d1 62%, transparent 75%); animation-delay: -9s; }
.orb-four { width: 30vw; height: 30vw; max-width: 390px; max-height: 390px; right: 2%; bottom: -6%; background: radial-gradient(circle at 40% 36%, #ffe1a9, #ffc4bc 62%, transparent 75%); animation-delay: -12s; }
.liquid-grain {
  position: absolute;
  inset: 0;
  opacity: .22;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 65%, rgba(255,255,255,.55) 0 1px, transparent 1.6px);
  background-size: 38px 38px, 53px 53px;
}
@keyframes liquid-drift {
  0% { transform: translate3d(-2%, -1%, 0) scale(1); }
  50% { transform: translate3d(4%, 3%, 0) scale(1.08); }
  100% { transform: translate3d(-1%, 5%, 0) scale(.98); }
}

.app-shell {
  z-index: 1;
  min-height: calc(100vh - 28px);
  margin: 14px auto;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .62);
  border-radius: 30px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .28) 48%, rgba(255, 255, 255, .5)),
    rgba(246, 250, 255, .36);
  box-shadow:
    0 30px 75px rgba(45, 64, 90, .17),
    inset 0 1px 0 rgba(255, 255, 255, .9);
  backdrop-filter: blur(30px) saturate(155%);
  -webkit-backdrop-filter: blur(30px) saturate(155%);
}

.appbar,
.telegram-header,
.chat-header,
.detail-header,
.chat-composer,
.comment-bar,
.bottom-nav {
  border-color: rgba(255, 255, 255, .58);
  background: linear-gradient(135deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .36));
  box-shadow: var(--glass-inset), 0 8px 24px rgba(50, 72, 102, .08);
  backdrop-filter: blur(24px) saturate(175%);
  -webkit-backdrop-filter: blur(24px) saturate(175%);
  contain: layout paint style;
}

.search-box,
.telegram-search,
.mention-popover,
.chat-search-results {
  border: 1px solid rgba(255, 255, 255, .64);
  background: linear-gradient(145deg, rgba(255, 255, 255, .56), rgba(255, 255, 255, .26));
  box-shadow: var(--glass-inset), 0 8px 22px rgba(45, 69, 100, .08);
  backdrop-filter: blur(22px) saturate(165%);
  -webkit-backdrop-filter: blur(22px) saturate(165%);
}

.search-box { border-radius: 18px; }
.telegram-search { border-radius: 999px; }
.telegram-search input::placeholder,

.liquid-refract {
  position: relative;
  --glass-fill: rgba(255, 255, 255, .28);
  --glass-ring: rgba(255, 255, 255, .72);
  isolation: isolate;
  background: transparent !important;
}
.appbar.liquid-refract,
.telegram-header.liquid-refract { position: sticky; }
.bottom-nav.liquid-refract,
.drawer.liquid-refract { position: fixed; }
.liquid-refract::before,
.liquid-refract::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}
.liquid-refract::before {
  z-index: -2;
  padding: 5px;
  border: 1px solid var(--glass-ring);
  background: transparent;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  backdrop-filter: url("#liquid_edge_filter") blur(1.5px) saturate(150%);
  -webkit-backdrop-filter: blur(4px) saturate(155%);
}
.liquid-refract::after {
  z-index: -1;
  background: linear-gradient(145deg, rgba(255,255,255,.2), transparent 42%, rgba(255,255,255,.12)), var(--glass-fill);
  box-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, .92),
    inset -1px -1px 0 rgba(255, 255, 255, .56),
    inset 3px 3px 9px rgba(255, 255, 255, .16),
    inset -3px -3px 8px rgba(255, 255, 255, .13);
  backdrop-filter: blur(5px) saturate(155%);
  -webkit-backdrop-filter: blur(5px) saturate(155%);
}
.liquid-refract > * { position: relative; z-index: 2; }
.appbar.liquid-refract,
.telegram-header.liquid-refract,
.bottom-nav.liquid-refract { --glass-fill: rgba(255, 255, 255, .34); }
.post-card.liquid-refract { --glass-fill: rgba(255, 255, 255, .2); }
.group-list.liquid-refract { --glass-fill: rgba(255, 255, 255, .3); }
.new-chat-panel.liquid-refract,
.post-sheet.liquid-refract,
.plus-action-sheet.liquid-refract,
.delete-dialog.liquid-refract { --glass-fill: rgba(255, 255, 255, .66); }
.edit-pill.liquid-refract,
.circle-action.liquid-refract { --glass-fill: rgba(255, 255, 255, .24); }
.topic-chip.liquid-refract.active,
.compose-action.liquid-refract,
.send-btn.liquid-refract {
  --glass-fill: rgba(48, 125, 232, .78);
  --glass-ring: rgba(255, 255, 255, .76);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;

}

/* 解瘾同款底部悬浮胶囊导航（名称不同） */
.bottom-nav {
  position: fixed;
  position: fixed !important;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  width: calc(100% - 24px);
  max-width: 460px;
  min-height: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 7px 15px;
  border: 1px solid rgba(255, 255, 255, .66);
  border-radius: 999px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.34));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(255,255,255,.46),
    0 12px 32px rgba(40, 64, 96, .18);
  backdrop-filter: blur(24px) saturate(175%);
  -webkit-backdrop-filter: blur(24px) saturate(175%);
}
.bottom-nav::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.75), transparent 46%);
  box-shadow:
    inset -10px -8px 0 -11px rgba(255,255,255,.7),
    inset 0 -9px 0 -8px rgba(255,255,255,.5),
    inset 0 1px 0 rgba(255,255,255,.95);
}
.tab-indicator {
  position: absolute;
  left: 0;
  top: 7px;
  height: calc(100% - 14px);
  width: 0;
  z-index: 1;
  border-radius: 999px;
  background: rgba(28, 38, 54, .12);
  box-shadow:
    inset 0 2px 5px rgba(31, 47, 67, .2),
    inset 0 -1px 0 rgba(255,255,255,.5);
  transition: transform .26s cubic-bezier(.22, 1, .36, 1), width .26s cubic-bezier(.22, 1, .36, 1);
  pointer-events: none;
  will-change: transform;
}
.nav-item.tab-btn {
  position: relative;
  z-index: 2;
  flex: 1 1 0;
  min-width: 0;
  height: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(28, 38, 54, .72);
  font-size: 9px;
  transition: color .22s ease, transform .12s ease;
  touch-action: manipulation;
}
.nav-item.tab-btn:active { transform: scale(.96); }
.nav-item.tab-btn.active,
.nav-item.tab-btn.active .nav-label { color: #1c2636; font-weight: 650; }
.nav-glyph {
  position: relative;
  display: grid;
  place-items: center;
}
.nav-chat-badge {
  position: absolute;
  top: -7px;
  right: -15px;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border: 2px solid rgba(255,255,255,.88);
  border-radius: 99px;
  background: #ff3b30;
  color: #fff;
  font-size: 10px;
  font-weight: 750;
  line-height: 1;
  box-shadow: 0 3px 9px rgba(210, 45, 49, .24);
}
.nav-icon {
  width: 30px;
  height: 30px;
  transition: transform .34s cubic-bezier(.3, 1.3, .5, 1);
}
.nav-item.tab-btn.active .nav-icon { transform: scale(1.06); stroke-width: 2.2; }
body[data-view="forum"] .nav-item.tab-btn.active .nav-icon {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: inherit;
  box-shadow: none;
}
.nav-label { line-height: 1; font-size: 11.5px; }
.tab-create {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #1c2636;
  transition: transform .22s cubic-bezier(.3, 1.35, .5, 1), color .2s ease;

.tab-create svg { width: 33px; height: 33px; }
.tab-create:active { transform: scale(1.12); color: #2b6fe2; }

/* Navigation depth and color states */
.bottom-nav {
  --nav-active-color: #2f7fe8;
  --nav-inactive-color: #202124;

}
html[data-theme="light"] .nav-item.tab-btn { --nav-icon-cutout: #ffffff; }

html[data-theme="dark"] .nav-item.tab-btn.active { --nav-icon-cutout: #45464b; }
.tab-indicator {
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), transparent 42%),
    #e4e5e8;
  box-shadow:
    inset 0 4px 9px rgba(40, 48, 60, .14),
    inset 0 -2px 4px rgba(255, 255, 255, .82),
    0 1px 0 rgba(255, 255, 255, .82);
}
.nav-item.tab-btn {
  color: var(--nav-inactive-color);
  transition: color .24s ease, transform .18s ease;
}
.nav-item.tab-btn .nav-glyph { position: relative; transition: transform .26s cubic-bezier(.3, 1.3, .5, 1); }
.nav-item.tab-btn .nav-icon {
  opacity: 1;
  transform: translateY(1px) scale(1);
  transition: opacity .24s ease, transform .28s cubic-bezier(.3, 1.35, .5, 1), stroke-width .2s ease;
}
.nav-item.tab-btn .nav-label {
  color: inherit;
  opacity: .82;
  transition: opacity .24s ease, color .24s ease, transform .26s cubic-bezier(.3, 1.3, .5, 1);
}
.nav-item.tab-btn.active {
  color: var(--nav-active-color);
  transform: none;
}
.nav-item.tab-btn.active .nav-icon {
  opacity: 1;
  transform: scale(1.04);
  stroke-width: 2.25;
}

  color: var(--nav-active-color);
  opacity: 1;
  font-weight: 700;
  transform: none;

}

}

  background:
    linear-gradient(180deg, rgba(255,255,255,.52), transparent 42%),
    #e4e5e8;
  box-shadow:
    inset 0 4px 9px rgba(40, 48, 60, .14),
    inset 0 -2px 4px rgba(255, 255, 255, .82),

/* Quiet mobile-first surfaces */
:root {

  --quiet-surface: #ffffff;
  --quiet-surface-soft: #f7f7fa;
  --quiet-text: #18181b;
  --quiet-muted: #77777d;
  --quiet-line: rgba(28, 28, 32, .09);
  --quiet-shadow: 0 8px 28px rgba(20, 22, 28, .07);
}

html, body {
  background: var(--quiet-bg) !important;
}
html {
  scrollbar-gutter: stable;
}
body {
  color: var(--quiet-text);
}

.liquid-background,
.liquid-grain {
  display: none !important;
}

.app-shell {
  min-height: 100vh;
  margin: 0 auto;
  border: 0;
  border-radius: 0;
  background: var(--quiet-bg);
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.appbar,
.telegram-header,
.chat-header,
.detail-header,
.chat-composer,
.comment-bar,
.bottom-nav {
  background: rgba(247, 247, 250, .96);
  border-color: var(--quiet-line);
  box-shadow: none;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.liquid-refract::before,
.liquid-refract::after {
  display: none !important;
}
.liquid-refract {
  background: var(--quiet-surface) !important;
}

.search-box,
.telegram-search,
.message-field,
.new-chat-search,
.plus-input,
.comment-bar input {

  --lg-tint: rgba(255, 255, 255, 0.5);
  --lg-line: rgba(255, 255, 255, 0.6);
  --lg-line-light: rgba(255, 255, 255, 0.95);

}

html[data-theme="dark"] {
  --lg-tint: rgba(120, 120, 128, 0.22);
  --lg-line: rgba(255, 255, 255, 0.1);
  --lg-line-light: rgba(255, 255, 255, 0.5);
  --lg-line-soft: rgba(255, 255, 255, 0.1);
  --lg-sheen: rgba(255, 255, 255, 0.22);
  --lg-shadow: 0 10px 26px rgba(0, 0, 0, 0.26);
  --lg-gloss-opacity: 0.6;
  --lg-capsule: rgba(0, 0, 0, 0.72);
}

.glass {
  position: relative;
  background: var(--lg-tint);
  border: 1px solid var(--lg-line);
  box-shadow: var(--lg-shadow), inset 0 1px 0 var(--lg-sheen);
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
  backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: linear-gradient(
    135deg,
    transparent 0%,
    var(--lg-line-soft) 26%,
    var(--lg-line-light) 62%,
    transparent 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  mix-blend-mode: screen;
  opacity: 0.75;
  pointer-events: none;
  z-index: 4;
}
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 3;
  opacity: var(--lg-gloss-opacity, 0.5);
  background: linear-gradient(180deg, color-mix(in srgb, var(--lg-sheen) 60%, transparent), transparent 46%);
  box-shadow:
    inset -10px -8px 0 -11px var(--lg-line-light),
    inset 0 -9px 0 -8px var(--lg-line-light),
    inset 0 1px 0 var(--lg-sheen);
}

.bottom-nav.glass {
  position: fixed !important;
  background: var(--lg-tint) !important;
  border-color: var(--lg-line);
  box-shadow: var(--lg-shadow), inset 0 1px 0 var(--lg-sheen);
  backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-saturate));
}
.bottom-nav.glass .tab-indicator {
  background: var(--lg-capsule);
  box-shadow:
    inset 0 2px 5px rgba(0, 0, 0, 0.4),
    inset 0 -1px 0 color-mix(in srgb, var(--lg-line-light) 22%, transparent);
}

html[data-theme="light"] .bottom-nav {
  --nav-active-color: #3478f6;
  --nav-inactive-color: #202124;
}
html[data-theme="dark"] .bottom-nav {
  --nav-active-color: #4d9fff;
  --nav-inactive-color: #f4f4f5;
}

/* Jieyin five-slot tab bar */
.icon-solid { display: none; }
.nav-item.tab-btn.active .icon-outline { display: none; }
.nav-item.tab-btn.active .icon-solid { display: block; }

html[data-theme="light"] .bottom-nav {
  --nav-active-color: #17171a;
  --nav-inactive-color: rgba(23, 23, 26, .78);
}
html[data-theme="dark"] .bottom-nav {

}
body[data-view] .nav-item.tab-btn {

}
body[data-view] .nav-item.tab-btn.active,
body[data-view] .nav-item.tab-btn.active .nav-icon {

}
.tab-create {

}
html[data-theme="dark"] .tab-create { color: #f5f5f7; }

/* Final icon colors: blue when selected, neutral when idle */
html[data-theme="light"] body[data-view] .bottom-nav {
  --nav-active-color: #3478f6;
  --nav-inactive-color: #202124;
}
html[data-theme="dark"] body[data-view] .bottom-nav {
  --nav-active-color: #4d9fff;
  --nav-inactive-color: #f4f4f5;
}
body[data-view] .bottom-nav .nav-item.tab-btn {
  color: var(--nav-inactive-color);
}
body[data-view] .bottom-nav .nav-item.tab-btn.active,
body[data-view] .bottom-nav .nav-item.tab-btn.active .nav-icon,
body[data-view] .bottom-nav .nav-item.tab-btn.active .nav-label {

}

/* Compact, visually centered forum search */
label.telegram-search {
  height: 38px;
  margin: 5px 24px 7px;
}
label.telegram-search > input {
  padding: 0 16px;
  text-align: center !important;
  font-size: 14px;
}
label.telegram-search > input::placeholder {
  color: transparent !important;
}
label.telegram-search > .telegram-search-prompt {
  position: absolute;
  inset: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: #92979e;
  opacity: 1;
  visibility: visible;
  pointer-events: none;
  transition: opacity .15s ease;
}
label.telegram-search > .telegram-search-prompt span {
  position: static;
  left: auto;
  color: #92979e;
  font-size: 14px;
  line-height: 1;
}

  color: #92979e;
  font-size: 18px;
  font-weight: 400;
  line-height: 1;
}
label.telegram-search > input:focus + .telegram-search-prompt,
label.telegram-search > input:not(:placeholder-shown) + .telegram-search-prompt {
  opacity: 0;
  visibility: hidden;
}

label.new-chat-search > input {
  padding: 0 14px;
  text-align: center !important;
  font-size: 16px;
}
label.new-chat-search > input::placeholder {
  color: transparent !important;
}
label.new-chat-search > .new-chat-search-prompt {
  position: absolute;
  inset: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  opacity: 1;
  visibility: visible;
  pointer-events: none;
  transition: opacity .15s ease;
}
label.new-chat-search > .new-chat-search-prompt span {
  position: static;
  left: auto;
  color: #92979e;
  font-size: 16px;
  line-height: 1;
}
label.new-chat-search > .new-chat-search-prompt b {
  color: #92979e;
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
}
label.new-chat-search > input:focus + .new-chat-search-prompt,
label.new-chat-search > input:not(:placeholder-shown) + .new-chat-search-prompt {
  opacity: 0;
  visibility: hidden;
}

/* Unified interaction motion */
.view.active {
  animation: view-enter .26s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes view-enter {
  from { opacity: 0; transform: translateY(8px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.post-card {
  animation: card-enter .28s cubic-bezier(.22, 1, .36, 1) both;
}
.post-column:nth-child(2) .post-card:nth-child(2) { animation-delay: .03s; }
.post-column:nth-child(2) .post-card:nth-child(3) { animation-delay: .06s; }
@keyframes card-enter {
  from { opacity: 0; transform: translateY(10px) scale(.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.group-row,
.chat-search-result,
.notification-item,
.comment {
  transition: background-color .18s ease, transform .18s ease;
}
.group-row:active,
.chat-search-result:active,
.notification-item:active {
  transform: scale(.985);
}

.select-circle {
  transition:
    background-color .2s ease,
    border-color .2s ease,
    color .2s ease,
    transform .24s cubic-bezier(.22, 1, .36, 1);
}
.select-circle.checked,
.group-row.selected .select-circle {
  transform: translateY(-50%) scale(1.1);
}
@keyframes edit-row-right {
  from { opacity: .45; transform: translateX(-26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes edit-row-left {
  from { opacity: .45; transform: translateX(22px); }
  to { opacity: 1; transform: translateX(0); }
}
.group-list.edit-shift-right .group-row {
  animation: edit-row-right .34s cubic-bezier(.22, 1, .36, 1) both;
}
.group-list.edit-shift-left .group-row {
  animation: edit-row-left .26s cubic-bezier(.22, 1, .36, 1) both;
}

.edit-action-bar {
  display: flex;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, 14px);
  transition:
    opacity .2s ease,
    transform .28s cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear .28s;
}
body.forum-editing .edit-action-bar {
  display: flex;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
  transition:
    opacity .2s ease,
    transform .28s cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear 0s;
}
.edit-action-bar button {
  transition: transform .16s ease, background-color .16s ease, color .16s ease;
}
.edit-action-bar button:active {
  transform: scale(.96);
}

.chat-search-result {
  animation: result-enter .2s ease both;
}
@keyframes result-enter {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.primary-btn,
.sheet-publish,
.plus-primary,
.comment-bar button,
.send-btn,
.tab-create,
.topic-chip {
  transition: transform .16s ease, background-color .18s ease, color .18s ease, box-shadow .18s ease;
}
.primary-btn:active,
.sheet-publish:active,
.plus-primary:active,
.comment-bar button:active,
.send-btn:active,
.tab-create:active,
.topic-chip:active {
  transform: scale(.95);
}

.bottom-nav {
  transition:
    opacity .2s ease,
    transform .28s cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear 0s;
}
body.forum-editing .bottom-nav {
  display: flex !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, 14px);
  transition:
    opacity .18s ease,
    transform .26s cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear .26s;
}

.chat-page.open,
.post-detail.open {
  animation: full-page-enter .24s cubic-bezier(.22, 1, .36, 1) both;
}

.chat-page.open {
  animation: chat-page-slide-in .34s cubic-bezier(.22, 1, .36, 1) both;
  will-change: transform;
}

.chat-page.open.closing {
  pointer-events: none;
  animation: chat-page-slide-out .3s cubic-bezier(.4, 0, 1, 1) both;
}

@keyframes chat-page-slide-in {
  from {
    opacity: .88;
    transform: translate3d(100%, 0, 0);
  }
  to {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
}

@keyframes chat-page-slide-out {
  from {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
  to {
    opacity: .92;
    transform: translate3d(100%, 0, 0);
  }
}

@keyframes full-page-enter {
  from { opacity: 0; transform: translateY(8px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Bottom-sheet motion instead of instant pop-up */
.new-chat-modal,
.post-modal,
.plus-action-modal {
  display: flex !important;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .24s ease, visibility 0s linear .36s;
}
.new-chat-modal.open,
.post-modal.open,
.plus-action-modal.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .24s ease, visibility 0s linear 0s;
}
.new-chat-panel {
  transform: translateY(110%);
  transition: transform .42s cubic-bezier(.22, 1, .36, 1);
  will-change: transform;
}
.new-chat-modal.open .new-chat-panel {
  transform: translateY(0);
}
.post-sheet,
.plus-action-sheet {
  opacity: 0;
  transform: translateY(26px) scale(.97);
  transition:
    opacity .22s ease,
    transform .34s cubic-bezier(.22, 1, .36, 1);
  will-change: transform, opacity;
}
.post-modal.open .post-sheet,
.plus-action-modal.open .plus-action-sheet {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Layered, compact new-conversation sheet */
.new-chat-panel {
  position: relative;
  isolation: isolate;
  width: min(680px, 100%);
  min-height: 93dvh;
  padding: 18px 22px calc(24px + env(safe-area-inset-bottom, 0px));

  border-radius: 44px 44px 0 0;

.new-chat-panel::before {
  content: "";
  position: absolute;
  z-index: -1;

  right: 13px;
  left: 13px;

  border-radius: 40px 40px 0 0;
  background: rgba(197, 200, 207, .92);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55);
}
html[data-theme="dark"] .new-chat-panel::before {

.new-chat-panel > header {

.new-chat-panel > header h2 {

}
.new-chat-panel > header button {

.new-chat-search {

.new-chat-search span {

.new-chat-search input {

}
.new-chat-options button {

.new-chat-options svg {

.new-chat-options strong {

/* Final optical centering pass for every icon container */
.icon-btn,
.header-icon,
.back-btn,
.send-btn,
.close-btn,
.compose-action,
.compose-toolbar button,
.circle-action,
.round-btn,
.group-avatar,
.search-result-avatar,
.chat-avatar,
.mini-avatar,
.detail-avatar,
.comment-avatar,
.profile-avatar,
.message-avatar,
.big-avatar,
.notify-icon,
.unread-bubble,
.badge,
.nav-chat-badge,
.nav-glyph,
.new-chat-panel > header button,
.emoji-picker button,
.select-circle {
  display: grid;
  place-items: center;
  padding: 0;
  line-height: 1;
  text-align: center;

.icon-btn > svg,
.header-icon > svg,
.back-btn > svg,
.send-btn > svg,
.close-btn > svg,
.compose-action > svg,
.circle-action > svg,
.round-btn > svg,
.nav-glyph > svg,
.new-chat-panel > header button > svg,
.emoji-picker button > svg {

/* Keep every navigation glyph on the same optical center line. */
.nav-item.tab-btn .nav-icon {
  transform: scale(1);
  transform-origin: center;
}

.nav-item.tab-btn.active .nav-icon {

/* Long-press message actions */
.message {

}

.message > .bubble-wrap {

}

.message.context-target .bubble {

.bubble {

.forwarded-label {

.reply-quote {

.message-action-layer {

  pointer-events: none;

.message-action-layer.open {

.message-action-scrim {

.message-reaction-bar button {

  <div class="toast" id="toast"></div>
  <script>
/* glass.js — 液态玻璃（框架无关：一条 <script> + 一组 CSS 变量）
 *
 * 思路来自 Shu Ding 的 liquid-glass / liquid-diamond（SVG 位移滤镜那一路）：
 *   1. 用 canvas 按元素自己的尺寸和圆角，逐像素算出一张位移贴图：
 *      R 通道存 X 位移、G 通道存 Y 位移，0.5 表示不动；
 *      "离边缘越近，采样点越往中心拉"，形成边缘的凸起折射；
 *   2. 这张贴图交给 feDisplacementMap，作为 backdrop-filter 作用在元素背后；
 *   3. 模糊和饱和度也放在滤镜内部，避免和 url() 抢同一条 backdrop-filter。
 *
 * 用法：容器加 .glass 类即可，脚本会自动扫描、按尺寸生成贴图，
 *      尺寸变化（转屏、拉伸）时自动重算。
 * 调参：CSS 变量 --lg-*（见 styles.css 的 :root）。
 */
(function () {
  "use strict";

  var FILTER_ID = "lg-refract";
  var SVG_ID = "lg-glass-defs";
  /* 贴图是一张平滑的位移场，不需要按屏幕像素精度来算：
     限制采样密度可以显著降低每次重算的开销（切页时的"卡一下"就来自这里） */
  var MAP_DPI = Math.min(1.5, window.devicePixelRatio || 1);
  var MAP_MAX_WIDTH = 480;

  var svg = null;
  var feMap = null;
  var feDisp = null;
  var feBlur = null;
  var feSat = null;
  var current = null; // 当前贴图对应的签名，避免重复计算

  /* ---------- 数学小工具（和参考实现一致） ---------- */

  function clamp(value, min, max) {
    return value < min ? min : value > max ? max : value;
  }

  function smoothStep(a, b, t) {
    t = clamp((t - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  /* 圆角矩形的有符号距离：内部为负、边缘为 0、外部为正 */
  function roundedRectSDF(x, y, halfWidth, halfHeight, radius) {
    var qx = Math.abs(x) - halfWidth + radius;
    var qy = Math.abs(y) - halfHeight + radius;
    var outside = Math.sqrt(Math.max(qx, 0) * Math.max(qx, 0) + Math.max(qy, 0) * Math.max(qy, 0));
    return Math.min(Math.max(qx, qy), 0) + outside - radius;
  }

  function cssNumber(name, fallback) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(name);
    var value = parseFloat(raw);
    return isFinite(value) ? value : fallback;
  }

  /* ---------- 生成位移贴图 ---------- */

  function buildMapData(width, height, radius, band, strength) {
    var scaleToFit = Math.min(1, MAP_MAX_WIDTH / Math.max(1, width));
    var dpi = MAP_DPI * scaleToFit;
    var w = Math.max(1, Math.round(width * dpi));
    var h = Math.max(1, Math.round(height * dpi));
    var bandPx = Math.max(1, band * dpi);
    var halfW = w / 2;
    var halfH = h / 2;
    var r = Math.min(radius * dpi, halfH, halfW);

    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    var image = ctx.createImageData(w, h);
    var data = image.data;
    var deltas = new Float32Array(w * h * 2);
    var maxDelta = 0;

    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var dx = x + 0.5 - halfW;
        var dy = y + 0.5 - halfH;
        var distance = -roundedRectSDF(dx, dy, halfW, halfH, r); // 距边缘的深度，内部为正
        var weight = 1 - smoothStep(0, bandPx, distance); // 贴边处最强，深入内部衰减到 0
        var pull = weight * strength;
        var moveX = dx * -pull; // 朝中心拉
        var moveY = dy * -pull;
        var index = (y * w + x) * 2;
        deltas[index] = moveX;
        deltas[index + 1] = moveY;
        var magnitude = Math.max(Math.abs(moveX), Math.abs(moveY));
        if (magnitude > maxDelta) maxDelta = magnitude;
      }
    }

    var scale = maxDelta > 0 ? maxDelta : 1;
    for (var i = 0, p = 0; p < deltas.length; i += 4, p += 2) {
      // 0.5 是"不动"，向两侧展开
      data[i] = Math.round((deltas[p] / scale + 0.5) * 255);
      data[i + 1] = Math.round((deltas[p + 1] / scale + 0.5) * 255);
      data[i + 2] = 128;
      data[i + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    return { url: canvas.toDataURL(), scale: scale / dpi };
  }

  /* ---------- SVG 滤镜 ---------- */

  function ensureSvg() {
    if (svg) return;
    var NS = "http://www.w3.org/2000/svg";
    svg = document.createElementNS(NS, "svg");
    svg.setAttribute("id", SVG_ID);
    svg.setAttribute("width", "0");
    svg.setAttribute("height", "0");
    svg.setAttribute("aria-hidden", "true");
    svg.style.cssText = "position:absolute;pointer-events:none";

    var defs = document.createElementNS(NS, "defs");
    var filter = document.createElementNS(NS, "filter");
    filter.setAttribute("id", FILTER_ID);
    filter.setAttribute("color-interpolation-filters", "sRGB");
    filter.setAttribute("x", "-20%");
    filter.setAttribute("y", "-20%");
    filter.setAttribute("width", "140%");
    filter.setAttribute("height", "140%");

    feBlur = document.createElementNS(NS, "feGaussianBlur");
    feBlur.setAttribute("in", "SourceGraphic");
    feBlur.setAttribute("result", "BLURRED");
    feBlur.setAttribute("stdDeviation", "0");

    feSat = document.createElementNS(NS, "feColorMatrix");
    feSat.setAttribute("type", "saturate");
    feSat.setAttribute("values", "1");

    feMap = document.createElementNS(NS, "feImage");
    feMap.setAttribute("x", "0");
    feMap.setAttribute("y", "0");
    feMap.setAttribute("preserveAspectRatio", "none");
    feMap.setAttribute("result", "MAP");

    feDisp = document.createElementNS(NS, "feDisplacementMap");
    feDisp.setAttribute("in", "BLURRED");
    feDisp.setAttribute("in2", "MAP");
    feDisp.setAttribute("xChannelSelector", "R");
    feDisp.setAttribute("yChannelSelector", "G");
    feDisp.setAttribute("scale", "0");

    filter.appendChild(feBlur);
    filter.appendChild(feSat);
    filter.appendChild(feMap);
    filter.appendChild(feDisp);
    defs.appendChild(filter);
    svg.appendChild(defs);
    document.body.appendChild(svg);
  }

  function supportsBackdropUrl() {
    if (!window.CSS || !CSS.supports) return false;
    return CSS.supports("backdrop-filter", "url(#a)") || CSS.supports("-webkit-backdrop-filter", "url(#a)");
  }

  /* ---------- 应用到元素 ---------- */

  function applyTo(el) {
    // Mobile uses the static glass styling. Building and compositing the SVG
    // displacement map during tab changes causes frame drops on phones.
    if (window.matchMedia("(max-width: 560px)").matches) return;
    ensureSvg();
    var rect = el.getBoundingClientRect();
    if (rect.width < 4 || rect.height < 4) return; // 还没布局

    var radius = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
    var band = cssNumber("--lg-refract-band", 20);
    var strength = cssNumber("--lg-refract-strength", 0.12);
    var blur = cssNumber("--lg-blur", 14);
    var saturate = cssNumber("--lg-saturate", 175) / 100;

    // 尺寸按 4px 取整：滚动条出现之类造成的 1px 变化不值得重算贴图
    var signature =
      Math.round(rect.width / 4) * 4 +
      "x" +
      Math.round(rect.height / 4) * 4 +
      ":" +
      radius +
      ":" +
      band +
      ":" +
      strength +
      ":" +
      blur +
      ":" +
      saturate;
    if (signature !== current) {
      var map = buildMapData(rect.width, rect.height, radius, band, strength);
      feMap.setAttribute("width", String(rect.width));
      feMap.setAttribute("height", String(rect.height));
      feMap.setAttributeNS("http://www.w3.org/1999/xlink", "href", map.url);
      feMap.setAttribute("href", map.url);
      feDisp.setAttribute("scale", String(map.scale));
      feBlur.setAttribute("stdDeviation", String(blur));
      feSat.setAttribute("values", String(saturate));
      current = signature;
    }

    if (supportsBackdropUrl()) {
      // 模糊、饱和度、折射都在这个滤镜里完成（Chromium）
      el.style.webkitBackdropFilter = "url(#" + FILTER_ID + ")";
      el.style.backdropFilter = "url(#" + FILTER_ID + ")";
    }
  }

  function scan() {
    var nodes = document.querySelectorAll(".glass");
    for (var i = 0; i < nodes.length; i++) applyTo(nodes[i]);
  }

  var scanTimer = null;
  function scheduleScan() {
    clearTimeout(scanTimer);
    /* 等 350ms 再扫：切页签时胶囊正在做 380ms 的形变动画，
       如果这时候重算位移贴图（要跑一遍 canvas 逐像素循环）会占住主线程、把动画卡掉。 */
    scanTimer = setTimeout(scan, 350);
  }

  function start() {
    if (!document.body) return;
    scan();
    window.addEventListener("resize", scheduleScan);
    if (window.MutationObserver) {
      // 只盯住 #app 的直接子节点：切页签会把底栏整个重建，这时要重新贴一次样式。
      // 不递归观察子树，避免每秒计时器刷新也触发扫描。
      var app = document.getElementById("app");
      if (app) new MutationObserver(scheduleScan).observe(app, { childList: true });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();

  // 想手动调用也行（框架里可以只留这一段）
  window.LiquidGlass = { apply: applyTo, refresh: scheduleScan, scan: scan };
})();

function measureTabIndicator() {
  const bar = $(".bottom-nav");
  const buttons = $$(".tab-btn", bar);
  if (!bar || !buttons.length) {
    tabIndicatorMetrics = null;
    return;
  }
  const barRect = bar.getBoundingClientRect();
  tabIndicatorMetrics = new Map(buttons.map((button) => {
    const rect = button.getBoundingClientRect();
    const width = rect.width + 14;
    return [
      button.dataset.view,
      {
        width: `${width}px`,
        transform: `translate3d(${rect.left + rect.width / 2 - barRect.left - bar.clientLeft - width / 2}px, 0, 0)`
      }
    ];
  }));
}

function placeTabIndicator() {
  const bar = $(".bottom-nav");
  const indicator = $(".tab-indicator", bar);
  const buttons = $$(".tab-btn", bar);
  if (!bar || !indicator || !buttons.length) return;
  const active = buttons.find((button) => button.classList.contains("active")) || buttons[0];
  if (!tabIndicatorMetrics) measureTabIndicator();
  const metric = tabIndicatorMetrics?.get(active.dataset.view);
  if (!metric) return;
  if (indicator.style.width !== metric.width) indicator.style.width = metric.width;
  indicator.style.transform = metric.transform;
}

function scheduleTabIndicatorMeasure() {
  cancelAnimationFrame(tabIndicatorMeasureFrame);

  const escaped = escapeHtml(text);

  return escaped.replace(new RegExp(pattern, "ig"), (match) => `<mark>${match}</mark>`);

  groups.forEach((group) => {

      results.push({
        type: "group",
        group,
        messageId: null,
        title: group.name,
        text: group.pinned,
        time: group.lastTime
      });
    }
    group.messages
      .filter((message) => message.sender && `${message.sender} ${message.text}`.toLowerCase().includes(lowered))
      .forEach((message) => {
        results.push({
          type: "message",
          group,
          messageId: message.id,
          title: group.name,
          text: `${message.sender}：${message.text}`,
          time: message.time
        });
      });
  });

  groupList.hidden = true;

function getMessageReactions(message) {

  chatPage.classList.remove("open", "closing");

function closeChat(animate = false, onClosed = null) {
  closeMessageActions();
  clearReplyTarget();
  exitMessageSelection();
  closeMessageForward();
  mentionPopover.classList.remove("open");

    chatPage.classList.add("closing");
    setTimeout(() => {
      finishCloseChat();
      onClosed?.();
    }, 300);
    return;
  }
  if (chatPage.classList.contains("closing")) return;
  finishCloseChat();
  onClosed?.();
}

function sendMessage() {
  const group = groups.find((item) => item.id === activeGroupId);
  const text = messageInput.value.trim();
  if (!group || !text) return;
  const replyTarget = group.messages.find((item) => item.id === replyTargetId);
  const nextMessage = { id: `m${Date.now()}`, sender: "我", text, time: "刚刚" };
  if (replyTarget) {
    nextMessage.replyTo = {
      id: replyTarget.id,
      sender: replyTarget.sender,
      text: replyTarget.text
    };
  }
  group.messages.push(nextMessage);
  group.lastTime = "刚刚";
  saveGroups();
  messageInput.value = "";
  clearReplyTarget();
  renderMessages(group);
  renderGroups();
}

function getActiveGroup() {
  return groups.find((item) => item.id === activeGroupId);

  return getActiveGroup()?.messages.find((item) => item.id === messageId);

function closeMessageActions(clearTarget = true) {
  messageActionLayer.classList.remove("open");
  messageActionLayer.setAttribute("aria-hidden", "true");
  if (clearTarget) {
    messageList.querySelectorAll(".message.context-target").forEach((item) => item.classList.remove("context-target"));

  }
}

function positionMessageActions(messageElement) {
  const chatRect = chatPage.getBoundingClientRect();
  const bubbleRect = messageElement.querySelector(".bubble")?.getBoundingClientRect();
  if (!bubbleRect) return;
  const clusterWidth = Math.min(306, chatRect.width - 24);
  const clusterHeight = messageActionCluster.offsetHeight || 390;
  const left = Math.max(12, Math.min(
    bubbleRect.left - chatRect.left - 16,
    chatRect.width - clusterWidth - 12
  ));
  const top = Math.max(66, Math.min(
    bubbleRect.top - chatRect.top - 52,
    chatRect.height - clusterHeight - 72
  ));
  messageActionCluster.style.setProperty("--message-actions-x", `${left}px`);
  messageActionCluster.style.setProperty("--message-actions-y", `${top}px`);
}

function openMessageActions(messageId, messageElement) {
  if (!getMessageById(messageId)) return;
  if (messageSelectionMode) return;
  const alreadyOpen = messageActionId === messageId && messageActionLayer.classList.contains("open");
  if (alreadyOpen) return;
  closeMessageActions();
  messageActionId = messageId;
  messageElement.classList.add("context-target");
  messageActionLayer.classList.add("open");
  messageActionLayer.setAttribute("aria-hidden", "false");
  positionMessageActions(messageElement);
  requestAnimationFrame(() => positionMessageActions(messageElement));
}

async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  try {
    const field = document.createElement("textarea");
    field.value = text;
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);
    field.select();
    const copied = document.execCommand("copy");
    field.remove();
    return copied;
  } catch {
    return false;
  }
}

function applyMessageReaction(messageId, emoji) {
  const message = getMessageById(messageId);
  if (!message) return;
  const reactions = getMessageReactions(message).map((reaction) => ({ ...reaction }));
  const existing = reactions.find((reaction) => reaction.emoji === emoji);
  if (existing?.mine) {
    existing.count -= 1;
    existing.mine = false;
    if (existing.count <= 0) reactions.splice(reactions.indexOf(existing), 1);
  } else if (existing) {
    existing.count += 1;
    existing.mine = true;
  } else {
    reactions.push({ emoji, count: 1, mine: true });
  }
  message.reactions = reactions;
  message.reaction = reactions.map((reaction) => `${reaction.emoji} ${reaction.count}`).join(" ");
  saveGroups();
  renderMessages(getActiveGroup());
  closeMessageActions();
}

function forwardMessagesToGroup(groupId) {

  const targetGroup = groups.find((group) => group.id === groupId);
  if (!sourceGroup || !targetGroup || !forwardMessageIds.length) return;
  const sourceMessages = sourceGroup.messages.filter((message) => forwardMessageIds.includes(message.id));
  if (!sourceMessages.length) return;
  sourceMessages.forEach((message, index) => {
    targetGroup.messages.push({
      id: `f${Date.now()}-${index}`,
      sender: "我",
      text: message.text,
      time: "刚刚",
      forwardedFrom: message.sender
    });
  });
  targetGroup.lastTime = "刚刚";
  targetGroup.unread = 0;
  saveGroups();
  renderGroups();
  if (activeGroupId === targetGroup.id) renderMessages(targetGroup);

function handleMessageAction(action) {
  const message = getMessageById(messageActionId);
  if (!message || !action) return;
  if (action === "reply") {
    setReplyTarget(message.id);
    closeMessageActions();
    return;
  }
  if (action === "copy") {
    copyText(message.text).then((copied) => {
      closeMessageActions();
      showToast(copied ? "消息已拷贝" : "拷贝失败，请重试");
    });
    return;
  }
  if (action === "speak") {
    speakMessage(message);
    closeMessageActions();
    return;
  }
  if (action === "forward") {
    openMessageForward([message.id]);
    return;
  }
  if (action === "report") {
    closeMessageActions();
    showToast("已提交举报，管理员会核查");
    return;
  }
  if (action === "delete") {
    deleteMessages(new Set([message.id]));
    return;
  }
  if (action === "select") {
    enterMessageSelection(message.id);
    closeMessageActions();
  }
}

function canStartChatSwipe(target) {
  if (!chatPage.classList.contains("open") || chatPage.classList.contains("closing")) return false;
  if (messageSelectionMode) return false;
  return !target.closest("button, a, input, textarea, [contenteditable='true']");
}

function shouldTriggerChatSwipe(deltaX, deltaY) {
  return deltaX <= -54 && Math.abs(deltaX) > Math.abs(deltaY) * 1.15;
}

function triggerChatSwipeBack() {
  if (chatSwipeTriggered || !chatPage.classList.contains("open")) return;
  chatSwipeTriggered = true;
  navigator.vibrate?.(10);
  closeChat(true, () => showView("forum"));
}

chatWallpaper.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "touch" || !canStartChatSwipe(event.target)) return;
  chatSwipeStart = { x: event.clientX, y: event.clientY };
  chatSwipeTriggered = false;
  try {
    chatWallpaper.setPointerCapture(event.pointerId);
  } catch {}
});

chatWallpaper.addEventListener("pointermove", (event) => {
  if (!chatSwipeStart || chatSwipeTriggered) return;
  const deltaX = event.clientX - chatSwipeStart.x;
  const deltaY = event.clientY - chatSwipeStart.y;
  if (Math.abs(deltaY) > 18 && Math.abs(deltaY) > Math.abs(deltaX)) {
    resetChatSwipe();
    return;
  }
  if (deltaX > -18 || Math.abs(deltaX) < Math.abs(deltaY) * 1.25) return;
  event.preventDefault();
  if (shouldTriggerChatSwipe(deltaX, deltaY)) triggerChatSwipeBack();
});

chatWallpaper.addEventListener("touchstart", (event) => {
  if (event.touches.length !== 1 || !canStartChatSwipe(event.target)) return;
  const touch = event.touches[0];
  chatTouchSwipeStart = { x: touch.clientX, y: touch.clientY };
  chatSwipeTriggered = false;
}, { passive: true });

chatWallpaper.addEventListener("touchmove", (event) => {
  if (!chatTouchSwipeStart || chatSwipeTriggered || event.touches.length !== 1) return;
  const touch = event.touches[0];
  const deltaX = touch.clientX - chatTouchSwipeStart.x;
  const deltaY = touch.clientY - chatTouchSwipeStart.y;
  if (Math.abs(deltaY) > 22 && Math.abs(deltaY) > Math.abs(deltaX)) {
    chatTouchSwipeStart = null;
    return;
  }
  if (shouldTriggerChatSwipe(deltaX, deltaY)) triggerChatSwipeBack();
}, { passive: true });

chatWallpaper.addEventListener("touchend", (event) => {
  if (!chatTouchSwipeStart || chatSwipeTriggered) {
    chatTouchSwipeStart = null;
    return;
  }
  const touch = event.changedTouches[0];
  if (touch) {
    const deltaX = touch.clientX - chatTouchSwipeStart.x;
    const deltaY = touch.clientY - chatTouchSwipeStart.y;
    if (shouldTriggerChatSwipe(deltaX, deltaY)) triggerChatSwipeBack();
  }
  chatTouchSwipeStart = null;
}, { passive: true });

chatWallpaper.addEventListener("touchcancel", () => {
  chatTouchSwipeStart = null;
}, { passive: true });

document.addEventListener("touchend", () => {
  chatTouchSwipeStart = null;
}, { passive: true });

document.addEventListener("touchcancel", () => {
  chatTouchSwipeStart = null;
}, { passive: true });

chatWallpaper.addEventListener("lostpointercapture", () => {
  chatSwipeStart = null;
});

function resetChatSwipe() {
  chatSwipeStart = null;
  chatSwipeTriggered = false;
}

$("#deleteGroups").addEventListener("click", () => {
  if (!selectedGroupIds.size) return;
  $("#deleteConfirmText").textContent = `将删除已选的 ${selectedGroupIds.size} 个群聊及其聊天记录。`;
  $("#deleteModal").classList.add("open");
});
$("#cancelDelete").addEventListener("click", () => $("#deleteModal").classList.remove("open"));
$("#deleteModal").addEventListener("click", (event) => {
  if (event.target === $("#deleteModal")) $("#deleteModal").classList.remove("open");
});
$("#confirmDelete").addEventListener("click", () => {
  const count = selectedGroupIds.size;
  groups = groups.filter((group) => !selectedGroupIds.has(group.id));
  selectedGroupIds.clear();
  saveGroups();
  $("#deleteModal").classList.remove("open");
  renderGroups();
  updateEditActions();
  showToast(`已删除 ${count} 个群聊`);
});

const liquidGlassSelector = [
  ".appbar", ".telegram-search", ".group-list",
  ".telegram-header", ".chat-header", ".pinned-bar", ".chat-composer",
  ".edit-action-bar button", ".edit-pill", ".circle-action", ".compose-action",
  ".menu-card", ".drawer", ".new-chat-panel", ".plus-action-sheet", ".delete-dialog", ".send-btn",
  ".mention-popover", ".chat-search-results"
].join(",");

function enhanceLiquidGlass() {
  document.querySelectorAll(liquidGlassSelector).forEach((element) => {
    element.classList.add("liquid-refract");
  });
}

enhanceLiquidGlass();
new MutationObserver(enhanceLiquidGlass).observe(document.body, { childList: true, subtree: true });
requestAnimationFrame(() => {
  measureTabIndicator();
  placeTabIndicator();
});
window.addEventListener("resize", scheduleTabIndicatorMeasure);
if ("ResizeObserver" in window) {
  new ResizeObserver(scheduleTabIndicatorMeasure).observe($(".bottom-nav"));
}

function setTheme(theme, persist = true) {
  const nextTheme = theme === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = nextTheme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute(
    "content",
    nextTheme === "dark" ? "#090a0c" : "#f2f2f7"
  );
  if (persist) localStorage.setItem("campus-community-theme", nextTheme);
  $$("[data-theme-choice]").forEach((button) => {
    button.classList.toggle("active", button.dataset.themeChoice === nextTheme);
  });
}

$$("[data-theme-choice]").forEach((button) => {
  button.addEventListener("click", () => setTheme(button.dataset.themeChoice));
});
setTheme(document.documentElement.dataset.theme || "light", false);

window.addEventListener("pointermove", (event) => {
  document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
  document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
}, { passive: true });

    if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
      let previewVersion = null;
      setInterval(async () => {
        try {
          const response = await fetch("/__version", { cache: "no-store" });
          const data = await response.json();
          if (previewVersion === null) {
            previewVersion = data.version;
          } else if (data.version !== previewVersion) {
            location.reload();
          }
        } catch {
          // The lightweight preview server may not be running.
        }
      }, 700);
    }
