<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f7" />
  <title>西科乌托邦 · 帖子与论坛</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("campus-community-theme") === "dark" ? "dark" : "light";
    } catch {}
  </script>
  <style>
:root {
  --ink: #202124;
  --muted: #8b9098;
  --line: #eceef1;
  --soft: #f5f6f8;
  --red: #ff2442;
  --blue: #3390ec;
  --blue-dark: #2680d8;
  --outgoing: #e4f2ff;
  --danger: #f04452;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 0 0, rgba(51, 144, 236, .12), transparent 25%),
    radial-gradient(circle at 100% 100%, rgba(255, 78, 103, .08), transparent 28%),
    #e9edf2;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell {
  position: relative;
  width: min(760px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  background: #f8f8f8;
  box-shadow: 0 0 45px rgba(23, 25, 28, .09);
}

.appbar {
  position: sticky;
  z-index: 15;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 66px;
  padding: 9px 18px;
  border-bottom: 1px solid rgba(236, 238, 241, .9);
  background: rgba(255, 255, 255, .95);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff4562, #ff7d67);
  color: #fff; font-size: 18px; font-weight: 800;
  box-shadow: 0 7px 18px rgba(255, 54, 83, .2);
}
.brand-copy { display: flex; flex-direction: column; gap: 2px; }
.brand-copy strong { font-size: 18px; }
.brand-copy small { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.brand-copy i, .online-pill i { width: 7px; height: 7px; border-radius: 50%; background: #2db67b; box-shadow: 0 0 0 3px rgba(45, 182, 123, .12); }
.appbar-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  position: relative;
  width: 39px; height: 39px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink); font-size: 19px;
}
.icon-btn:hover { background: #f3f4f6; }
.publish-btn { background: #f4f5f7; color: var(--ink); font-size: 24px; }
.badge {
  position: absolute; top: 2px; right: 1px;
  min-width: 17px; height: 17px; padding: 0 4px;
  display: grid; place-items: center;
  border: 2px solid #fff; border-radius: 99px;
  background: var(--danger); color: #fff;
  font-size: 9px; font-weight: 750;
}
.hide { display: none !important; }

.content { padding: 19px 18px 94px; }
.view { display: none; }
.view.active { display: block; }

body[data-view="forum"] .appbar { display: none; }
body[data-view="forum"] .app-shell { background: #fff; }
body[data-view="forum"] .content { padding: 0 0 102px; }
body[data-view="forum"] .home-note { display: none; }

.telegram-header {
  position: sticky;
  z-index: 12;
  top: 0;
  display: grid;
  grid-template-columns: minmax(70px, 1fr) auto minmax(108px, 1fr);
  align-items: center;
  min-height: 76px;
  padding: 18px 16px 10px;
  background: rgba(255, 255, 255, .95);
  backdrop-filter: blur(15px);
}
.edit-pill {
  justify-self: start;
  min-width: 70px;
  height: 42px;
  padding: 0 16px;
  border: 1px solid #e1e4e8;
  border-radius: 99px;
  background: #fff;
  color: var(--ink);
  font-size: 16px;
  box-shadow: 0 2px 7px rgba(25, 30, 36, .04);
}
.chat-heading { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.chat-heading strong { font-size: 20px; letter-spacing: -.3px; }
.telegram-search {
  position: relative;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 16px 12px;
  overflow: hidden;
  border-radius: 99px;
  background: #f1f2f4;
}
.telegram-search span {
  position: absolute;
  left: calc(50% - 49px);
  color: #92979e;
  font-size: 27px;
  line-height: 1;
  pointer-events: none;
}
.telegram-search input {
  width: 100%;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  text-align: center;
  font-size: 18px;
}
.telegram-search input::placeholder { color: #92979e; opacity: 1; }
.chat-search-results { display: none; padding: 0 14px; }
.chat-search-results.open { display: block; }
.chat-search-heading {
  display: flex;
  justify-content: space-between;
  padding: 9px 4px 7px;
  color: var(--muted);
  font-size: 11px;
}
.chat-search-result {
  width: 100%;
  display: grid;
  grid-template-columns: 43px minmax(0, 1fr);
  gap: 11px;
  align-items: center;
  padding: 12px 4px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  text-align: left;
}
.chat-search-result:hover { background: #f8fafc; }
.search-result-avatar {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  font-size: 17px;
  font-weight: 750;
}
.search-result-copy { min-width: 0; }
.search-result-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.search-result-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.search-result-top time { color: var(--muted); font-size: 9px; white-space: nowrap; }
.search-result-snippet {
  display: -webkit-box;
  overflow: hidden;
  margin-top: 4px;
  color: #6e747c;
  font-size: 11px;
  line-height: 1.45;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.search-result-snippet mark { padding: 0 2px; border-radius: 3px; background: #fff1b8; color: #202124; }
.search-empty { padding: 42px 12px; color: var(--muted); font-size: 12px; text-align: center; }
.telegram-actions { justify-self: end; display: flex; align-items: center; gap: 12px; }
.circle-action, .compose-action {
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.circle-action {
  position: relative;
  width: 45px;
  height: 45px;
  border: 1px solid #d9dde3;
  background: #fff;
  color: var(--ink);
}
.circle-action::before {
  content: "";
  position: absolute;
  width: 29px;
  height: 29px;
  border: 2px dashed #202327;
  border-radius: 50%;
  transform: rotate(-24deg);
}
.circle-action span { position: relative; z-index: 1; font-size: 27px; font-weight: 300; line-height: 1; }
.compose-action {
  width: 49px;
  height: 49px;
  border: 0;
  background: var(--blue);
  color: #fff;
  box-shadow: 0 6px 15px rgba(51, 144, 236, .2);
}
.compose-action svg {
  width: 27px;
  height: 27px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
body[data-view="forum"] .group-list {
  margin-top: 4px;
  border-radius: 0;
  background: #fff;
}
body[data-view="forum"] .group-row {
  position: relative;
  grid-template-columns: 60px minmax(0, 1fr) auto;
  gap: 12px;
  min-height: 84px;
  padding: 12px 16px;
}
body[data-view="forum"] .group-avatar { width: 60px; height: 60px; font-size: 23px; }
body[data-view="forum"] .group-name { font-size: 15px; }
body[data-view="forum"] .group-preview {
  display: -webkit-box;
  margin-top: 5px;
  overflow: hidden;
  white-space: normal;
  line-height: 1.35;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  font-size: 13px;
}
body[data-view="forum"] .group-time { font-size: 11px; }
body[data-view="forum"] .group-right { padding: 5px 0; }
body[data-view="forum"] .unread-bubble { min-width: 30px; height: 23px; font-size: 11px; }

body.forum-editing .group-row {
  padding-left: 66px;
  cursor: default;
}
body.forum-editing .group-row.selected { background: #f1f7ff; }
.select-circle {
  position: absolute;
  left: 17px;
  top: 50%;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  transform: translateY(-50%);
  border: 2px solid #c7cacf;
  border-radius: 50%;
  background: #fff;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
.group-row.selected .select-circle { border-color: var(--blue); background: var(--blue); }
.edit-action-bar {
  position: fixed;
  z-index: 32;
  left: 50%;
  bottom: 15px;
  width: min(calc(760px - 28px), calc(100% - 28px));
  display: none;
  transform: translateX(-50%);
  gap: 10px;
}
body.forum-editing .edit-action-bar { display: flex; }
body.forum-editing .bottom-nav { display: none; }
.edit-action-bar button {
  flex: 1;
  height: 49px;
  border: 1px solid rgba(223, 227, 232, .95);
  border-radius: 99px;
  background: rgba(255, 255, 255, .94);
  color: #25282c;
  font-size: 15px;
  box-shadow: 0 8px 24px rgba(28, 36, 44, .13);
  backdrop-filter: blur(14px);
}
.edit-action-bar button:hover { background: #fff; }
.edit-action-bar button:disabled { color: #b6bac0; cursor: default; }

body[data-view="forum"] .bottom-nav {
  bottom: 12px;
  left: 50%;
  width: min(calc(760px - 24px), calc(100% - 24px));
  padding: 5px 18px;
  border: 1px solid rgba(223, 227, 232, .95);
  border-radius: 34px;
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 9px 26px rgba(28, 36, 44, .15);
}
body[data-view="forum"] .nav-item { gap: 2px; padding: 5px; font-size: 10px; }
body[data-view="forum"] .nav-item.active .nav-icon {
  padding: 7px 15px;
  border-radius: 22px;
  background: #dceeff;
  color: var(--blue);
}
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; margin: 1px 0 17px; }
.page-heading h1 { margin: 0; font-size: 27px; letter-spacing: -.7px; }
.page-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.online-pill {
  display: flex; align-items: center; gap: 7px;
  margin-top: 8px; padding: 6px 10px;
  border-radius: 99px; background: #f1faf6;
  color: #229368; font-size: 10px;
}
.forum-count { margin-top: 8px; color: var(--muted); font-size: 10px; }

.search-box {
  height: 42px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 13px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: #f1f2f4;
}
.search-box:focus-within { border-color: #e7c8ce; background: #fff; box-shadow: 0 0 0 3px rgba(255, 36, 66, .05); }
.search-box span { color: #8e939a; font-size: 19px; }
.search-box input { width: 100%; border: 0; outline: 0; background: transparent; }
.search-box input::placeholder { color: #9ba0a7; }

.topic-scroller {
  display: flex; gap: 8px;
  margin: 12px -18px 20px;
  padding: 0 18px;
  overflow-x: auto;
  scrollbar-width: none;
}
.topic-scroller::-webkit-scrollbar { display: none; }
.topic-chip {
  flex: 0 0 auto;
  border: 0; border-radius: 99px;
  padding: 7px 12px;
  background: #fff; color: #656a71; font-size: 12px;
}
.topic-chip.active { background: #222; color: #fff; font-weight: 600; }
.feed-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.feed-label h2 { margin: 0; font-size: 16px; }
.feed-label span { color: var(--muted); font-size: 10px; }

.post-grid { columns: 2; column-gap: 10px; }
.post-card {
  width: 100%;
  display: inline-block;
  break-inside: avoid;
  margin: 0 0 12px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
}
.post-cover {
  position: relative;
  height: 185px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 14px;
}
.post-cover.tall { height: 235px; }
.post-cover::before, .post-cover::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, .18);
}
.post-cover::before { width: 130px; height: 130px; left: -38px; top: -34px; }
.post-cover::after { width: 90px; height: 90px; right: -24px; bottom: -22px; }
.cover-emoji { position: relative; z-index: 1; font-size: 54px; filter: drop-shadow(0 9px 15px rgba(0, 0, 0, .12)); }
.cover-caption {
  position: absolute; z-index: 2; left: 11px; bottom: 10px;
  padding: 4px 8px; border-radius: 7px;
  background: rgba(255, 255, 255, .83); color: #5b5e63;
  font-size: 9px; backdrop-filter: blur(5px);
}
.post-title {
  display: -webkit-box;
  overflow: hidden;
  margin: 8px 2px 6px;
  font-size: 13px; line-height: 1.45;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.post-meta { display: flex; align-items: center; justify-content: space-between; gap: 5px; padding: 0 2px; }
.post-user { display: flex; align-items: center; gap: 5px; min-width: 0; color: #72777e; font-size: 10px; }
.mini-avatar {
  flex: 0 0 20px; width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 50%; background: #dfe3e8;
  color: #646a72; font-size: 8px; font-weight: 700;
}
.post-likes { color: #7c8188; font-size: 10px; white-space: nowrap; }
.empty-state { padding: 55px 12px; color: var(--muted); text-align: center; line-height: 1.7; }

.list-label { display: flex; align-items: center; justify-content: space-between; margin: 23px 3px 8px; color: var(--muted); font-size: 11px; }
.list-label button { border: 0; background: transparent; color: var(--blue); font-size: 11px; }
.group-list { display: flex; flex-direction: column; background: #fff; border-radius: 15px; overflow: hidden; }
.group-list[hidden] { display: none; }
.group-row {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr) auto;
  align-items: center; gap: 11px;
  width: 100%; padding: 12px;
  border: 0; border-bottom: 1px solid var(--line);
  background: #fff; color: var(--ink); text-align: left;
}
.group-row:last-child { border-bottom: 0; }
.group-row:hover { background: #fafbfc; }
.group-avatar {
  position: relative; width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 50%; color: #fff; font-size: 21px; font-weight: 750;
}
.group-avatar::after {
  content: ""; position: absolute; right: 1px; bottom: 2px;
  width: 10px; height: 10px; border: 2px solid #fff;
  border-radius: 50%; background: #2db67b;
}
.group-content { min-width: 0; }
.group-name-line { display: flex; align-items: center; gap: 6px; }
.group-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
.pin-mini { color: #aeb2b8; font-size: 10px; }
.group-preview { margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
.group-right { align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; min-width: 32px; padding: 4px 0; }
.group-time { color: #9ca1a8; font-size: 9px; white-space: nowrap; }
.unread-bubble { min-width: 21px; height: 21px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px; background: var(--blue); color: #fff; font-size: 9px; font-weight: 700; }
.unread-bubble.quiet { background: #eceef1; color: #8f949b; }
.home-note { display: flex; gap: 9px; margin-top: 15px; padding: 12px; border-radius: 12px; background: #f2f4f7; color: #70767e; font-size: 10px; line-height: 1.55; }
.home-note span { color: var(--red); }
.home-note p { margin: 0; }

.profile-hero {
  padding: 27px 16px 20px;
  border-radius: 18px;
  color: #fff;
  text-align: center;
  background: linear-gradient(140deg, #ff536d, #ff7b63 60%, #ffb15e);
}
.profile-avatar { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 12px; border: 3px solid rgba(255,255,255,.75); border-radius: 50%; background: rgba(255,255,255,.22); font-size: 25px; font-weight: 750; }
.profile-hero h1 { margin: 0 0 5px; font-size: 22px; }
.profile-hero > p { margin: 0; opacity: .85; font-size: 11px; }
.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
.profile-stats button { display: flex; flex-direction: column; gap: 2px; border: 0; background: transparent; color: #fff; }
.profile-stats strong { font-size: 17px; }
.profile-stats span { opacity: .8; font-size: 9px; }
.my-shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.my-shortcuts button { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 15px 6px; border: 0; border-radius: 14px; background: #fff; color: var(--ink); }
.my-shortcuts button > span { font-size: 19px; color: var(--red); }
.my-shortcuts strong { font-size: 11px; }
.my-shortcuts small { color: var(--muted); font-size: 9px; }
.menu-card { padding: 0 14px; border-radius: 14px; background: #fff; }
.menu-card button { width: 100%; display: flex; justify-content: space-between; padding: 16px 1px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
.menu-card button:last-child { border-bottom: 0; }
.menu-card span { color: var(--muted); font-size: 11px; }
.prototype-note { padding: 0 5px; color: var(--muted); font-size: 10px; line-height: 1.6; }

.bottom-nav {
  position: fixed; z-index: 16; left: 50%; bottom: 0;
  width: min(760px, 100%); transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 8px 26px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(18px);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; border: 0; background: transparent; color: #999ea5; font-size: 9px; }
.nav-item.active { color: var(--ink); font-weight: 650; }
.nav-icon { font-size: 18px; line-height: 1; }

.chat-page, .post-detail {
  position: fixed; z-index: 30; inset: 0;
  display: none; flex-direction: column;
  width: min(760px, 100%); margin: 0 auto;
  background: #eef2f5;
}
.chat-page.open, .post-detail.open { display: flex; }
.chat-header, .detail-header {
  z-index: 2; display: flex; align-items: center; gap: 7px;
  min-height: 62px; padding: 8px 11px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
}
.back-btn { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); font-size: 30px; line-height: 1; }
.chat-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 0; border: 0; background: transparent; text-align: left; color: var(--ink); }
.chat-avatar { flex: 0 0 38px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 16px; font-weight: 750; }
.chat-title-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chat-title-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chat-title-copy small { color: var(--muted); font-size: 9px; }
.header-icon { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); font-size: 18px; }
.header-icon:hover { background: #f2f4f7; }
.pinned-bar { display: flex; align-items: center; gap: 8px; min-height: 35px; padding: 7px 14px; border-bottom: 1px solid #dde3e9; background: rgba(255,255,255,.9); }
.pinned-bar span { color: var(--blue); }
.pinned-bar p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #667080; font-size: 10px; }
.chat-wallpaper {
  flex: 1; overflow-y: auto;
  background-color: #eaf0f5;
  background-image:
    radial-gradient(circle at 20px 20px, rgba(86,129,162,.065) 1.5px, transparent 1.5px),
    radial-gradient(circle at 60px 60px, rgba(86,129,162,.05) 1px, transparent 1px);
  background-size: 80px 80px;
}
.message-list { display: flex; flex-direction: column; gap: 8px; padding: 14px 12px 20px; }
.date-pill, .system-message { align-self: center; margin: 3px auto; padding: 4px 9px; border-radius: 99px; background: rgba(91,108,123,.12); color: #637180; font-size: 9px; }
.system-message { background: rgba(255,255,255,.72); }
.message { display: flex; align-items: flex-end; gap: 7px; max-width: 82%; align-self: flex-start; }
.message.mine { align-self: flex-end; flex-direction: row-reverse; }
.message-avatar { flex: 0 0 29px; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; }
.bubble-wrap { min-width: 0; }
.sender-name { margin: 0 0 3px 4px; color: #527897; font-size: 10px; font-weight: 650; }
.message.mine .sender-name { margin-right: 4px; text-align: right; }
.bubble { padding: 8px 11px 6px; border-radius: 12px 12px 12px 4px; background: #fff; box-shadow: 0 1px 2px rgba(36,51,65,.08); color: #25292e; font-size: 13px; line-height: 1.48; word-break: break-word; white-space: pre-wrap; }
.message.mine .bubble { border-radius: 12px 12px 4px 12px; background: var(--outgoing); }
.message.search-focus .bubble {
  outline: 2px solid #39a7ea;
  outline-offset: 2px;
  animation: search-bubble-pulse 1.2s ease-out;
}
@keyframes search-bubble-pulse {
  0% { box-shadow: 0 0 0 0 rgba(57, 167, 234, .45); }
  100% { box-shadow: 0 0 0 12px rgba(57, 167, 234, 0); }
}
.message-extra { display: flex; justify-content: flex-end; margin-top: 2px; color: #8091a1; font-size: 8px; }
.mention { color: #147dcc; font-weight: 650; }
.bubble-reaction { width: max-content; margin: -3px 0 0 7px; padding: 2px 5px; border: 1px solid #dbe5ed; border-radius: 8px; background: #fff; color: #617487; font-size: 9px; }
.mention-popover { display: none; position: absolute; z-index: 4; left: 12px; right: 12px; bottom: 65px; max-height: 150px; overflow-y: auto; padding: 9px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 12px 35px rgba(28,30,33,.14); }
.mention-popover.open { display: flex; flex-wrap: wrap; gap: 7px; }
.mention-popover button { border: 1px solid var(--line); border-radius: 99px; background: #f5f7fa; padding: 6px 10px; color: #4f5e6c; font-size: 11px; }
.chat-composer { z-index: 3; display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid #dfe5eb; background: #fff; }
.compose-toolbar { display: flex; gap: 2px; padding-bottom: 2px; }
.compose-toolbar button { width: 31px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #73808d; font-size: 17px; }
.message-field { flex: 1; min-height: 38px; display: flex; align-items: center; padding: 7px 12px; border: 1px solid #e1e5ea; border-radius: 18px; background: #f7f8fa; }
.message-field:focus-within { border-color: #b7d7f6; background: #fff; }
.message-field textarea { width: 100%; max-height: 100px; overflow-y: auto; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.4; }
.send-btn { width: 39px; height: 39px; border: 0; border-radius: 50%; background: var(--blue); color: #fff; font-size: 18px; }

.detail-header { justify-content: space-between; }
.detail-header strong { font-size: 15px; }
.detail-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
}
.detail-header .back-btn { justify-self: start; }
.detail-header strong { justify-self: center; }
.detail-header .header-icon { justify-self: end; }
.detail-scroll { flex: 1; overflow-y: auto; padding-bottom: 80px; background: #fff; }
.detail-cover { height: min(46vh, 380px); display: grid; place-items: center; font-size: 92px; }
.detail-content { padding: 17px 18px 22px; }
.detail-author { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
.detail-avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #e6e9ed; color: #5f6670; font-size: 12px; font-weight: 700; }
.detail-author div { display: flex; flex-direction: column; gap: 2px; }
.detail-author strong { font-size: 12px; }
.detail-author small { color: var(--muted); font-size: 9px; }
.detail-follow { margin-left: auto; border: 1px solid var(--red); border-radius: 99px; background: #fff; color: var(--red); padding: 5px 12px; font-size: 10px; }
.detail-title { margin: 0 0 10px; font-size: 20px; line-height: 1.42; letter-spacing: -.3px; }
.detail-text { color: #44494f; font-size: 14px; line-height: 1.75; white-space: pre-wrap; }
.detail-topic { display: inline-block; margin-top: 13px; padding: 4px 8px; border-radius: 7px; background: #f2f3f5; color: #686e75; font-size: 10px; }
.detail-actions { display: flex; gap: 22px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); color: #6d737a; font-size: 12px; }
.detail-actions button { display: flex; align-items: center; gap: 4px; border: 0; background: transparent; color: inherit; }
.detail-actions button.liked { color: var(--red); }
.comments-wrap { padding: 15px 18px 24px; border-top: 8px solid #f5f5f5; background: #fff; }
.comments-wrap h3 { margin: 0 0 12px; font-size: 13px; }
.comment { display: flex; gap: 9px; padding: 9px 0; }
.comment-avatar { flex: 0 0 31px; width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: #e8eaee; color: #6e747b; font-size: 10px; font-weight: 700; }
.comment > div { flex: 1; }
.comment strong { font-size: 10px; }
.comment p { margin: 4px 0 0; color: #4e545b; font-size: 12px; line-height: 1.55; }
.comment small { display: block; margin-top: 4px; color: #a0a5ab; font-size: 9px; }
.comment-bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
.comment-bar input { flex: 1; min-width: 0; padding: 10px 13px; border: 0; border-radius: 99px; outline: 0; background: #f2f3f5; }
.comment-bar button { border: 0; border-radius: 99px; background: var(--red); color: #fff; padding: 0 16px; font-weight: 650; }

.drawer {
  position: fixed; z-index: 45; top: 0;
  right: max(0px, calc((100vw - 760px) / 2));
  width: min(390px, 100%); height: 100vh;
  padding: 22px 18px; overflow-y: auto;
  background: #fff; box-shadow: -18px 0 45px rgba(28,30,33,.13);
  transform: translateX(105%); visibility: hidden;
  transition: transform .25s ease, visibility .25s;
}
.drawer.open { transform: translateX(0); visibility: visible; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.drawer-head h2 { margin: 0; font-size: 25px; }
.drawer-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
.close-btn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: #fff; color: var(--muted); font-size: 21px; }
.drawer-tools { display: flex; justify-content: space-between; margin: 26px 0 9px; color: var(--muted); font-size: 11px; }
.drawer-tools button { border: 0; background: transparent; color: var(--blue); font-size: 11px; }
.notification-list { display: flex; flex-direction: column; }
.notification-item { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: #fff; color: var(--ink); text-align: left; }
.notification-item.unread { background: linear-gradient(90deg, rgba(255,237,240,.8), transparent); }
.notify-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: #fff; font-size: 15px; font-weight: 700; }
.notification-copy strong { display: block; margin-bottom: 2px; font-size: 12px; }
.notification-copy p { margin: 0; color: #626970; font-size: 11px; line-height: 1.5; }
.notification-time { color: var(--muted); font-size: 9px; white-space: nowrap; }
.profile-rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.profile-rows button { display: flex; justify-content: space-between; padding: 16px 3px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
.profile-rows span { color: var(--muted); }
.group-profile { margin: 27px 0 18px; text-align: center; }
.group-profile .big-avatar { width: 82px; height: 82px; display: grid; place-items: center; margin: 0 auto 12px; border-radius: 50%; color: #fff; font-size: 32px; font-weight: 750; }
.group-profile h3 { margin: 0 0 5px; font-size: 19px; }
.group-profile p { margin: 0; color: var(--muted); font-size: 11px; }
.drawer-scrim { position: fixed; z-index: 40; inset: 0; background: rgba(21,29,38,.3); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.drawer-scrim.show { opacity: 1; pointer-events: auto; }

.post-modal { position: fixed; z-index: 50; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(21,29,38,.34); backdrop-filter: blur(3px); }
.post-modal.open { display: flex; }
.post-sheet { width: min(590px,100%); max-height: 90vh; overflow-y: auto; padding: 18px; border-radius: 22px; background: #fff; box-shadow: 0 25px 70px rgba(28,30,33,.2); }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 17px; }
.sheet-head h2 { margin: 0; font-size: 16px; }
.sheet-head > button:first-child { justify-self: start; border: 0; background: transparent; color: var(--muted); }
.primary-btn { justify-self: end; border: 0; border-radius: 99px; background: var(--red); color: #fff; padding: 8px 17px; font-weight: 650; }
.post-kind-tabs, .compose-topics { display: flex; gap: 7px; flex-wrap: wrap; }
.post-kind-tabs { margin-bottom: 12px; }
.post-kind-tabs button { border: 1px solid var(--line); border-radius: 99px; background: #f6f7f8; padding: 7px 12px; font-size: 12px; }
.post-kind-tabs button.active { border-color: #ffb3bf; background: #fff0f2; color: var(--red); font-weight: 650; }
.compose-topics { margin-bottom: 8px; }
.compose-topics button { border: 0; border-radius: 7px; background: #f4f5f7; color: #737880; padding: 5px 8px; font-size: 10px; }
.compose-topics button.active { background: #303236; color: #fff; }
.post-title-input, .post-content-input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
.post-title-input { padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 18px; font-weight: 650; }
.post-content-input { padding: 12px 2px; min-height: 130px; resize: vertical; line-height: 1.7; }
.emoji-picker { padding-top: 12px; border-top: 1px solid var(--line); }
.emoji-picker > span { color: var(--muted); font-size: 10px; }
#emojiChoices { display: flex; gap: 8px; margin-top: 8px; }
#emojiChoices button { width: 39px; height: 39px; border: 1px solid var(--line); border-radius: 11px; background: #f6f7f8; font-size: 20px; }
#emojiChoices button.active { border-color: #ff9cad; background: #fff0f2; }

.new-chat-modal {
  position: fixed;
  z-index: 68;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 44px 0 0;
  background: rgba(15, 18, 22, .72);
}
.new-chat-modal.open { display: flex; }
.new-chat-panel {
  width: min(760px, 100%);
  min-height: 92vh;
  padding: 19px 28px 30px;
  border-radius: 36px 36px 0 0;
  background: #fff;
  box-shadow: 0 -18px 55px rgba(0, 0, 0, .18);
}
.new-chat-panel > header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 18px;
}
.new-chat-panel > header h2 { margin: 0; font-size: 23px; letter-spacing: -.4px; }
.new-chat-panel > header button {
  justify-self: start;
  width: 48px;
  height: 48px;
  border: 1px solid #e6e8eb;
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  font-size: 34px;
  font-weight: 300;
  line-height: 1;
}
.new-chat-search {
  position: relative;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;

  background: #f1f2f4;
}
.new-chat-search span {

.new-chat-search input {

.new-chat-options { display: flex; flex-direction: column; }
.new-chat-options button {

  align-items: center;
  gap: 25px;

  border: 0;
  border-bottom: 1px solid #eceef1;

}
.new-chat-options button:hover { background: #f8fafc; }
.new-chat-options svg {

  stroke-width: 2;

.new-chat-options strong { font-size: 21px; font-weight: 500; }

.plus-action-modal {
  position: fixed;
  z-index: 70;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(22, 28, 35, .36);
  backdrop-filter: blur(3px);
}
.plus-action-modal.open { display: flex; }
.plus-action-sheet {
  width: min(500px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px;
  border-radius: 21px;
  background: #fff;
  box-shadow: 0 25px 70px rgba(28, 30, 33, .22);
}
.plus-action-sheet > header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.plus-action-sheet > header h2 { margin: 0; font-size: 19px; }
.plus-action-sheet > header button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #fff;
  color: var(--muted);
  font-size: 21px;
}
.plus-form { display: flex; flex-direction: column; gap: 13px; }
.plus-form label { display: flex; flex-direction: column; gap: 6px; color: #666d75; font-size: 11px; }
.plus-input {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 11px;

  background: #f7f8fa;

.plus-input:focus { border-color: #b7d7f6; background: #fff; }
.plus-primary {

.delete-modal {
  position: fixed;
  z-index: 80;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(19, 24, 30, .4);
  backdrop-filter: blur(3px);

.delete-modal.open { display: flex; }
.delete-dialog {
  width: min(340px, 100%);

.delete-dialog h2 { margin: 0; font-size: 18px; }
.delete-dialog p { margin: 9px 0 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.delete-dialog > div { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.delete-dialog button { padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: #f5f6f8; color: var(--ink); }
.delete-dialog #confirmDelete { border-color: #efc5ca; background: #fff0f2; color: #e13e4b; font-weight: 650; }

.toast { position: fixed; z-index: 100; left: 50%; bottom: 82px; max-width: calc(100% - 36px); transform: translate(-50%,14px); padding: 10px 16px; border-radius: 99px; background: rgba(26,32,38,.94); color: #fff; font-size: 11px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
.toast.show { opacity: 1; transform: translate(-50%,0); }

/* Development live preview is enabled by live_server.py. */

@media (min-width: 650px) {

}

  .app-shell { box-shadow: none; }

  .content { padding: 16px 12px 87px; }
  .topic-scroller { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; }

  .post-cover.tall { height: 218px; }
  .group-row { grid-template-columns: 51px minmax(0,1fr) auto; gap: 9px; padding: 11px; }

  .chat-header { padding: 7px 8px; }
  .message-list { padding: 12px 8px 18px; }
  .chat-composer { padding-left: 6px; padding-right: 6px; }
}

/* Liquid Glass theme */
:root {
  --glass-stroke: rgba(255, 255, 255, .72);
  --glass-stroke-soft: rgba(255, 255, 255, .42);
  --glass-shadow: 0 18px 48px rgba(43, 63, 92, .14);
  --glass-inset: inset 0 1px 0 rgba(255, 255, 255, .92), inset 0 -1px 0 rgba(255, 255, 255, .24);
  --pointer-x: 50vw;
  --pointer-y: 20vh;
}

html { background: #dceaf7; }

body {
  overflow-x: hidden;
  background:
    radial-gradient(circle at 9% 6%, rgba(150, 207, 255, .85), transparent 31%),
    radial-gradient(circle at 91% 17%, rgba(255, 190, 217, .72), transparent 30%),
    radial-gradient(circle at 17% 90%, rgba(180, 245, 221, .8), transparent 33%),
    radial-gradient(circle at 86% 82%, rgba(255, 219, 167, .62), transparent 30%),
    linear-gradient(145deg, #eef5fb 0%, #e8f1f8 44%, #f6eff4 100%);
}

.liquid-background {
  position: fixed;
  z-index: 0;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.liquid-filter-defs {
  position: fixed;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}
.liquid-background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(330px circle at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, .28), transparent 72%);
  transition: background .2s ease;
}
.liquid-orb {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(8px);
  opacity: .72;
  mix-blend-mode: screen;
  animation: liquid-drift 16s ease-in-out infinite alternate;
}
.orb-one { width: 42vw; height: 42vw; max-width: 520px; max-height: 520px; left: -9%; top: -11%; background: radial-gradient(circle at 35% 30%, #a9d9ff, #7f9fed 60%, transparent 72%); }
.orb-two { width: 35vw; height: 35vw; max-width: 460px; max-height: 460px; right: -8%; top: 7%; background: radial-gradient(circle at 45% 35%, #ffd2e5, #c7a3ff 62%, transparent 75%); animation-delay: -5s; }
.orb-three { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; left: 4%; bottom: -17%; background: radial-gradient(circle at 45% 38%, #c5ffe9, #8de0d1 62%, transparent 75%); animation-delay: -9s; }
.orb-four { width: 30vw; height: 30vw; max-width: 390px; max-height: 390px; right: 2%; bottom: -6%; background: radial-gradient(circle at 40% 36%, #ffe1a9, #ffc4bc 62%, transparent 75%); animation-delay: -12s; }
.liquid-grain {
  position: absolute;
  inset: 0;
  opacity: .22;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 65%, rgba(255,255,255,.55) 0 1px, transparent 1.6px);
  background-size: 38px 38px, 53px 53px;
}
@keyframes liquid-drift {
  0% { transform: translate3d(-2%, -1%, 0) scale(1); }
  50% { transform: translate3d(4%, 3%, 0) scale(1.08); }
  100% { transform: translate3d(-1%, 5%, 0) scale(.98); }
}

.app-shell {
  z-index: 1;
  min-height: calc(100vh - 28px);
  margin: 14px auto;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .62);
  border-radius: 30px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .58), rgba(255, 255, 255, .28) 48%, rgba(255, 255, 255, .5)),
    rgba(246, 250, 255, .36);
  box-shadow:
    0 30px 75px rgba(45, 64, 90, .17),
    inset 0 1px 0 rgba(255, 255, 255, .9);
  backdrop-filter: blur(30px) saturate(155%);
  -webkit-backdrop-filter: blur(30px) saturate(155%);
}

.appbar,
.telegram-header,
.chat-header,
.detail-header,
.chat-composer,
.comment-bar,
.bottom-nav {
  border-color: rgba(255, 255, 255, .58);
  background: linear-gradient(135deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .36));
  box-shadow: var(--glass-inset), 0 8px 24px rgba(50, 72, 102, .08);
  backdrop-filter: blur(24px) saturate(175%);
  -webkit-backdrop-filter: blur(24px) saturate(175%);
}

.search-box,
.telegram-search,
.mention-popover,
.chat-search-results {
  border: 1px solid rgba(255, 255, 255, .64);
  background: linear-gradient(145deg, rgba(255, 255, 255, .56), rgba(255, 255, 255, .26));
  box-shadow: var(--glass-inset), 0 8px 22px rgba(45, 69, 100, .08);
  backdrop-filter: blur(22px) saturate(165%);
  -webkit-backdrop-filter: blur(22px) saturate(165%);
}

.search-box { border-radius: 18px; }
.telegram-search { border-radius: 999px; }
.telegram-search input::placeholder,
.search-box input::placeholder { text-shadow: 0 1px 0 rgba(255,255,255,.7); }

.topic-chip {
  border: 1px solid rgba(255, 255, 255, .55);
  background: rgba(255, 255, 255, .38);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 5px 14px rgba(55,77,107,.07);
  backdrop-filter: blur(14px) saturate(160%);

.liquid-refract {

.appbar.liquid-refract,
.telegram-header.liquid-refract { position: sticky; }
.bottom-nav.liquid-refract,
.drawer.liquid-refract { position: fixed; }
.liquid-refract::before,
.liquid-refract::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}
.liquid-refract::before {
  z-index: -2;
  padding: 5px;
  border: 1px solid var(--glass-ring);
  background: transparent;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  backdrop-filter: url("#liquid_edge_filter") blur(1.5px) saturate(150%);
  -webkit-backdrop-filter: blur(4px) saturate(155%);
}
.liquid-refract::after {
  z-index: -1;
  background: linear-gradient(145deg, rgba(255,255,255,.2), transparent 42%, rgba(255,255,255,.12)), var(--glass-fill);
  box-shadow:
    inset 1px 1px 0 rgba(255, 255, 255, .92),
    inset -1px -1px 0 rgba(255, 255, 255, .56),
    inset 3px 3px 9px rgba(255, 255, 255, .16),
    inset -3px -3px 8px rgba(255, 255, 255, .13);
  backdrop-filter: blur(5px) saturate(155%);
  -webkit-backdrop-filter: blur(5px) saturate(155%);
}
.liquid-refract > * { position: relative; z-index: 2; }
.appbar.liquid-refract,
.telegram-header.liquid-refract,
.bottom-nav.liquid-refract { --glass-fill: rgba(255, 255, 255, .34); }

  --glass-fill: rgba(48, 125, 232, .78);
  --glass-ring: rgba(255, 255, 255, .76);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

/* 解瘾同款底部悬浮胶囊导航（名称不同） */
.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  width: calc(100% - 24px);
  max-width: 460px;
  min-height: 0;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 7px 15px;
  border: 1px solid rgba(255, 255, 255, .66);
  border-radius: 999px;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.34));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.92),
    inset 0 -1px 0 rgba(255,255,255,.46),
    0 12px 32px rgba(40, 64, 96, .18);
  backdrop-filter: blur(24px) saturate(175%);
  -webkit-backdrop-filter: blur(24px) saturate(175%);
}
.bottom-nav::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.75), transparent 46%);
  box-shadow:
    inset -10px -8px 0 -11px rgba(255,255,255,.7),
    inset 0 -9px 0 -8px rgba(255,255,255,.5),
    inset 0 1px 0 rgba(255,255,255,.95);
}
.tab-indicator {
  position: absolute;
  left: 0;
  top: 7px;
  height: calc(100% - 14px);
  width: 0;
  z-index: 1;
  border-radius: 999px;
  background: rgba(28, 38, 54, .12);
  box-shadow:
    inset 0 2px 5px rgba(31, 47, 67, .2),
    inset 0 -1px 0 rgba(255,255,255,.5);

}

function escapeHtml(value) {
  return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

function highlightMentions(value) {
  return escapeHtml(value).replace(/@(?:教室|宿舍)\d+|@[\u4e00-\u9fa5A-Za-z0-9_]+/g, '<span class="mention">$&</span>');
}

function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2100);
}

function showView(viewName) {
  closeChat();
  closePostDetail();
  closeDrawers();
  document.body.dataset.view = viewName;
  $$(".view").forEach((view) => view.classList.remove("active"));
  $(`#${viewName}View`).classList.add("active");
  $$(".nav-item").forEach((item) => item.classList.toggle("active", item.dataset.view === viewName));
  animateTabIndicator();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function placeTabIndicator() {
  const bar = $(".bottom-nav");
  const indicator = $(".tab-indicator", bar);
  const buttons = $$(".tab-btn", bar);
  if (!bar || !indicator || !buttons.length) return;
  const active = buttons.find((button) => button.classList.contains("active")) || buttons[0];
  const barRect = bar.getBoundingClientRect();
  const activeRect = active.getBoundingClientRect();
  const left = activeRect.left - barRect.left - bar.clientLeft;
  indicator.style.width = `${activeRect.width}px`;
  indicator.style.transform = `translateX(${left}px)`;
}

let tabIndicatorFrame = 0;
function animateTabIndicator() {
  cancelAnimationFrame(tabIndicatorFrame);
  const endAt = performance.now() + 420;
  const tick = () => {
    placeTabIndicator();
    if (performance.now() < endAt) {
      tabIndicatorFrame = requestAnimationFrame(tick);
    }
  };
  tabIndicatorFrame = requestAnimationFrame(tick);
}

function renderPosts() {
  const query = $("#postSearch").value.trim().toLowerCase();
  let visible = posts.filter((post) => {
    const topicMatch = activeTopic === "推荐" || post.category === activeTopic;
    const queryMatch = !query || `${post.title} ${post.body} ${post.author} ${post.category}`.toLowerCase().includes(query);
    return topicMatch && queryMatch;
  });
  $("#postFeedTitle").textContent = activeTopic === "推荐" ? "大家正在聊" : activeTopic;
  $("#postCount").textContent = `${visible.length} 篇`;
  if (!visible.length) {
    postGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">没有找到相关帖子<br>换个话题或关键词试试</div>';
    return;
  }
  const columnItems = [[], []];
  visible.forEach((post, index) => columnItems[index % 2].push(post));
  const cardMarkup = (post) => `
    <button class="post-card" data-post="${post.id}">
      <div class="post-cover ${post.tall ? "tall" : ""}" style="background:${post.gradient}">
        <span class="cover-emoji">${post.emoji}</span>
        <span class="cover-caption">${escapeHtml(post.caption)}</span>
      </div>
      <div class="post-title">${escapeHtml(post.title)}</div>
      <div class="post-meta">
        <span class="post-user"><span class="mini-avatar">${escapeHtml(post.author[0])}</span>${escapeHtml(post.author)}</span>
        <span class="post-likes">♡ ${post.likes}</span>
      </div>
    </button>
  `;
  postGrid.innerHTML = columnItems.map((items, index) => `
    <div class="post-column ${index === 1 ? "offset" : ""}">
      ${items.map(cardMarkup).join("")}
    </div>
  `).join("");
}

function avatarColor(name) {
  const colors = ["#4e88de", "#33a781", "#db9144", "#876cd4"];
  let sum = 0;
  for (const char of name) sum += char.codePointAt(0);
  return colors[sum % colors.length];
}

        ${post.author === "我" ? "" : '<button class="detail-follow">关注</button>'}
      </div>
      <h1 class="detail-title">${escapeHtml(post.title)}</h1>
      <div class="detail-text">${escapeHtml(post.body)}</div>
      <span class="detail-topic">#${escapeHtml(post.category)}</span>
      <div class="detail-actions">
        <button id="likePost" class="${post.liked ? "liked" : ""}">${post.liked ? "♥" : "♡"} ${post.likes}</button>
        <button>💬 ${post.comments}</button>
        <button id="savePost">${post.saved ? "★" : "☆"} 收藏</button>
      </div>
    </div>
    <div class="comments-wrap">
      <h3>评论 ${post.comments}</h3>
      <div class="comment-list">
        ${post.replies.map((reply) => `
          <div class="comment">
            <span class="comment-avatar">${escapeHtml(reply.author[0])}</span>
            <div><strong>${escapeHtml(reply.author)}</strong><p>${escapeHtml(reply.text)}</p><small>${escapeHtml(reply.time)}</small></div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
  postDetail.classList.add("open");
  $("#postDetailBody").scrollTop = 0;
  bindPostActions(post);
}

function bindPostActions(post) {
  $("#likePost").addEventListener("click", () => {
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    savePosts();
    openPost(post.id);
    renderPosts();
  });
  $("#savePost").addEventListener("click", () => {
    post.saved = !post.saved;
    savePosts();
    openPost(post.id);
    showToast(post.saved ? "已收藏" : "已取消收藏");
  });
}

function closePostDetail() {
  postDetail.classList.remove("open");
  activePostId = null;
}

function sendComment() {
  const input = $("#commentInput");
  const text = input.value.trim();
  const post = posts.find((item) => item.id === activePostId);
  if (!text || !post) return;
  post.replies.push({ author: "我", text, time: "刚刚" });
  post.comments += 1;
  savePosts();
  input.value = "";
  openPost(post.id);
  setTimeout(() => {
    const body = $("#postDetailBody");
    body.scrollTop = body.scrollHeight;
  }, 20);
}

function renderGroups() {
  const visible = groups;
  if (!visible.length) {
    groupList.innerHTML = '<div class="empty-state" style="width:100%">没有找到相关论坛群聊</div>';
    updateChatNavBadge();
    return;
  }
  groupList.innerHTML = visible.map((group) => {
    const last = [...group.messages].reverse().find((item) => item.text);
    const selected = selectedGroupIds.has(group.id);
    return `
      <button class="group-row ${forumEditMode ? "selectable" : ""} ${selected ? "selected" : ""}" data-group="${group.id}" aria-pressed="${selected}">
        ${forumEditMode ? `<span class="select-circle">${selected ? "✓" : ""}</span>` : ""}
        <span class="group-avatar" style="background:${group.color}">${group.icon}</span>
        <span class="group-content">
          <span class="group-name-line"><span class="group-name">${escapeHtml(group.name)}</span><span class="pin-mini">⌖</span></span>
          <span class="group-preview">${last?.sender ? `${escapeHtml(last.sender)}: ` : ""}${escapeHtml(last?.text || "")}</span>
        </span>
        <span class="group-right"><span class="group-time">${group.lastTime}</span>${group.unread ? `<span class="unread-bubble">${group.unread}</span>` : '<span class="unread-bubble quiet">✓</span>'}</span>
      </button>
    `;
  }).join("");
  updateChatNavBadge();
}

function highlightSearch(text, query) {
  const escaped = escapeHtml(text);
  const pattern = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return escaped.replace(new RegExp(pattern, "ig"), (match) => `<mark>${match}</mark>`);
}

function renderChatSearch() {
  const query = $("#groupSearch").value.trim();
  if (!query) {
    chatSearchResults.classList.remove("open");
    chatSearchResults.innerHTML = "";
    groupList.hidden = false;
    renderGroups();
    return;
  }

  const lowered = query.toLowerCase();
  const results = [];
  groups.forEach((group) => {
    if (`${group.name} ${group.pinned}`.toLowerCase().includes(lowered)) {
      results.push({
        type: "group",
        group,
        messageId: null,
        title: group.name,
        text: group.pinned,
        time: group.lastTime
      });
    }
    group.messages
      .filter((message) => message.sender && `${message.sender} ${message.text}`.toLowerCase().includes(lowered))
      .forEach((message) => {
        results.push({
          type: "message",
          group,
          messageId: message.id,
          title: group.name,
          text: `${message.sender}：${message.text}`,
          time: message.time
        });
      });
  });

  groupList.hidden = true;
  chatSearchResults.classList.add("open");
  if (!results.length) {
    chatSearchResults.innerHTML = `<div class="search-empty">没有找到相关聊天记录</div>`;
    return;
  }

  chatSearchResults.innerHTML = `
    <div class="chat-search-heading"><span>${results.some((item) => item.type === "message") ? "聊天记录" : "群聊"}</span><span>${results.length} 条</span></div>
    ${results.map((result) => `
      <button class="chat-search-result" data-search-group="${result.group.id}" ${result.messageId ? `data-message-id="${result.messageId}"` : ""}>
        <span class="search-result-avatar" style="background:${result.group.color}">${result.group.icon}</span>
        <span class="search-result-copy">
          <span class="search-result-top"><strong>${escapeHtml(result.title)}</strong><time>${escapeHtml(result.time)}</time></span>
          <span class="search-result-snippet">${highlightSearch(result.text, query)}</span>
        </span>
      </button>
    `).join("")}
  `;
}

function updateEditActions() {
  const count = selectedGroupIds.size;
  $("#deleteGroups").disabled = count === 0;
}

function setForumEditMode(enabled) {
  forumEditMode = enabled;
  selectedGroupIds.clear();
  if (enabled) {
    $("#groupSearch").value = "";
    renderChatSearch();
  }
  document.body.classList.toggle("forum-editing", enabled);
  $("#editGroupsBtn").textContent = enabled ? "完成" : "编辑";
  updateEditActions();
  renderGroups();
}

function toggleGroupSelection(groupId) {
  if (selectedGroupIds.has(groupId)) {
    selectedGroupIds.delete(groupId);
  } else {
    selectedGroupIds.add(groupId);
  }
  renderGroups();
  updateEditActions();
}

function renderMessages(group) {
  messageList.innerHTML = group.messages.map((message) => {
    if (message.type === "date") return `<div class="date-pill">${escapeHtml(message.text)}</div>`;
    if (message.type === "system") return `<div class="system-message">${escapeHtml(message.text)}</div>`;
    const mine = message.sender === "我";
    return `
      <div class="message ${mine ? "mine" : ""}" data-message-id="${message.id}">
        ${mine ? "" : `<span class="message-avatar" style="background:${message.color}">${escapeHtml(message.sender[0])}</span>`}
        <div class="bubble-wrap">
          <div class="sender-name">${escapeHtml(message.sender)}</div>
          <div class="bubble">${highlightMentions(message.text)}<span class="message-extra">${escapeHtml(message.time)}</span></div>
          ${message.reaction ? `<div class="bubble-reaction">${escapeHtml(message.reaction)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");
  requestAnimationFrame(() => {
    const wallpaper = $(".chat-wallpaper");
    wallpaper.scrollTop = wallpaper.scrollHeight;
  });
}

function openChat(groupId, focusMessageId = null) {
  const group = groups.find((item) => item.id === groupId);
  if (!group) return;
  activeGroupId = groupId;
  group.unread = 0;
  saveGroups();
  renderGroups();
  $("#chatAvatar").textContent = group.icon;
  $("#chatAvatar").style.background = group.color;
  $("#chatName").textContent = group.name;
  $("#chatStatus").textContent = `${group.members} 位成员 · ${mutedGroups.has(group.id) ? "已静音" : "在线"}`;
  $("#pinnedText").textContent = group.pinned;
  $("#chatMuteBtn").textContent = mutedGroups.has(group.id) ? "🔕" : "🔔";
  mentionPopover.innerHTML = group.mentions.map((item) => `<button data-mention="${item}">${item}</button>`).join("");
  mentionPopover.classList.remove("open");
  renderMessages(group);
  chatPage.classList.add("open");
  if (focusMessageId) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const target = messageList.querySelector(`[data-message-id="${CSS.escape(focusMessageId)}"]`);
        if (!target) return;
        target.scrollIntoView({ block: "center" });
        target.classList.add("search-focus");
        setTimeout(() => target.classList.remove("search-focus"), 1800);
      });
    });
  }
}

function closeChat() {
  chatPage.classList.remove("open");
  mentionPopover.classList.remove("open");
  activeGroupId = null;
  messageInput.value = "";
}

function sendMessage() {
  const group = groups.find((item) => item.id === activeGroupId);
  const text = messageInput.value.trim();
  if (!group || !text) return;
  group.messages.push({ id: `m${Date.now()}`, sender: "我", text, time: "刚刚" });
  group.lastTime = "刚刚";
  saveGroups();
  messageInput.value = "";
  renderMessages(group);
  renderGroups();
}

function insertMention(mention) {
  const start = messageInput.selectionStart ?? messageInput.value.length;
  const before = messageInput.value.slice(0, start).replace(/\s*$/, "");
  const after = messageInput.value.slice(start);
  messageInput.value = `${before}${before ? " " : ""}${mention} ${after}`;
  messageInput.focus();
  mentionPopover.classList.remove("open");
}

function updateBadges() {
  const count = notifications.filter((item) => item.unread).length;
  $("#notifyBadge").textContent = count;
  $("#notifyBadge").classList.toggle("hide", count === 0);
}

function updateChatNavBadge() {
  const count = groups.reduce((total, group) => total + (group.unread || 0), 0);
  const badge = $("#chatNavBadge");
  if (!badge) return;
  badge.textContent = count > 99 ? "99+" : count;
  badge.classList.toggle("hide", count === 0);
}

function renderNotifications() {
  const colors = { comment: "#ff6b7f", like: "#ff8a4c", mention: "#4d83df", system: "#737b86" };
  const icons = { comment: "💬", like: "♥", mention: "@", system: "i" };
  notificationList.innerHTML = notifications.map((item) => `
    <button class="notification-item ${item.unread ? "unread" : ""}" ${item.group ? `data-notify-group="${item.group}"` : item.target ? `data-notify-post="${item.target}"` : ""}>
      <span class="notify-icon" style="background:${colors[item.type]}">${icons[item.type]}</span>
      <span class="notification-copy"><strong>${escapeHtml(item.title)}</strong><p>${escapeHtml(item.text)}</p></span>
      <span class="notification-time">${escapeHtml(item.time)}</span>

function gradientFor(topic) {

    "学习互助": "linear-gradient(145deg,#7198ef,#aac8ff)",
    "宿舍日常": "linear-gradient(145deg,#48b394,#a8ead4)",
    "随便聊聊": "linear-gradient(145deg,#b788d8,#e2c4f2)"

function publishPost() {
  const title = $("#newPostTitle").value.trim();
  const body = $("#newPostContent").value.trim();
  if (!title || !body) {
    showToast("先写标题和内容");
    return;
  }
  posts.unshift({
    id: `p${Date.now()}`, kind: composeKind, category: composeTopic, title, body,
    emoji: composeEmoji, gradient: gradientFor(composeTopic), caption: composeKind === "提问" ? "求解答" : "新分享",
    author: "我", likes: 0, comments: 0, tall: title.length > 24, liked: false, saved: false,
    time: "刚刚", replies: []
  });
  savePosts();
  postModal.classList.remove("open");
  activeTopic = "推荐";
  $$("#postTopics .topic-chip").forEach((button) => button.classList.toggle("active", button.dataset.topic === "推荐"));
  $("#postSearch").value = "";
  renderPosts();
  showView("posts");

}

const liquidGlassSelector = [
  ".appbar", ".search-box", ".telegram-search", ".post-card", ".group-list",
  ".telegram-header", ".chat-header", ".pinned-bar", ".chat-composer",
  ".detail-header", ".comment-bar", ".bottom-nav", ".edit-action-bar button",
  ".edit-pill", ".circle-action", ".compose-action", ".topic-chip",
  ".my-shortcuts button", ".menu-card", ".drawer", ".new-chat-panel",
  ".post-sheet", ".plus-action-sheet", ".delete-dialog", ".send-btn",
  ".mention-popover", ".chat-search-results"
].join(",");

function enhanceLiquidGlass() {
  document.querySelectorAll(liquidGlassSelector).forEach((element) => {
    element.classList.add("liquid-refract");
  });
}

enhanceLiquidGlass();
new MutationObserver(enhanceLiquidGlass).observe(document.body, { childList: true, subtree: true });
placeTabIndicator();
window.addEventListener("resize", placeTabIndicator);

function setTheme(theme, persist = true) {
  const nextTheme = theme === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = nextTheme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute(
    "content",
    nextTheme === "dark" ? "#090a0c" : "#f2f2f7"
  );
  if (persist) localStorage.setItem("campus-community-theme", nextTheme);
  $$("[data-theme-choice]").forEach((button) => {
    button.classList.toggle("active", button.dataset.themeChoice === nextTheme);
  });
}

$$("[data-theme-choice]").forEach((button) => {
  button.addEventListener("click", () => setTheme(button.dataset.themeChoice));
});
setTheme(document.documentElement.dataset.theme || "light", false);

window.addEventListener("pointermove", (event) => {
  document.documentElement.style.setProperty("--pointer-x", `${event.clientX}px`);
  document.documentElement.style.setProperty("--pointer-y", `${event.clientY}px`);
}, { passive: true });

  <script>
    if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
      let previewVersion = null;
      setInterval(async () => {
        try {
          const response = await fetch("/__version", { cache: "no-store" });
          const data = await response.json();
          if (previewVersion === null) {
            previewVersion = data.version;
          } else if (data.version !== previewVersion) {
            location.reload();
          }
        } catch {
          // The lightweight preview server may not be running.
        }
      }, 700);
    }
  </script>
